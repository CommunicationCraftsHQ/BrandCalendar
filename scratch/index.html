<style>
/* ═══ ScratchDeal · the play page · V1.0 New Jersey (27 Oct 2026) ═══
   Three looks from "03 - Scratch card templates - mockup.html", chosen by
   the campaign's config.look: saffron (Saffron Tear), noir (Maison Noir),
   bloom (Soft Bloom). One page, so one QR address: scratch/?g=<slug>. */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{overflow:hidden;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;opacity:0;transition:opacity .4s}
body.ready{opacity:1}
#app{position:relative;margin:0 auto;max-width:480px;height:100%;height:100dvh;display:flex;flex-direction:column;align-items:center;overflow:hidden;isolation:isolate;
  --cw:clamp(140px,min(46vw,30dvh),196px);--ch:calc(var(--cw)*1.39);--cw0:var(--cw)}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + clamp(26px,6dvh,54px)) 22px calc(env(safe-area-inset-bottom) + clamp(18px,3.5dvh,30px))}
.scr.on{display:flex}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
#testTag{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);z-index:40;padding:4px 12px;border-radius:999px;background:#1d4ed8;color:#fff;font:600 10px Inter;letter-spacing:.14em;text-transform:uppercase}
.brand{min-height:16px;display:flex;justify-content:center}
.brand img{max-height:clamp(28px,5dvh,42px);max-width:60vw;object-fit:contain}
.top{text-align:center;transition:opacity .6s;width:100%}
.kick{margin-top:10px}
h1{margin-top:8px}
.sub{margin-top:8px}
.stage{position:relative;width:100%;flex:1;min-height:calc(var(--ch)*1.3);perspective:1100px}
.c{position:absolute;left:50%;top:50%;width:var(--cw);height:var(--ch);margin:calc(var(--ch)/-2) 0 0 calc(var(--cw)/-2);transform-style:preserve-3d;cursor:pointer;
   transition:transform var(--d,.8s) cubic-bezier(.77,0,.18,1),opacity var(--d,.8s) ease}
.face{position:absolute;inset:0;border-radius:calc(var(--cw)*.078);overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.back{transform:rotateY(180deg)}
.chosen .front{pointer-events:none}
.prize{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 10px}
.prize .big{white-space:pre-line}
.won .prize .big{animation:settle 1.2s .2s cubic-bezier(.2,.8,.2,1)}
@keyframes settle{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.prize::after{content:"";position:absolute;top:-30%;bottom:-30%;width:45%;left:-70%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-16deg);opacity:0;pointer-events:none}
.won .prize::after{animation:sweep 1.6s .5s cubic-bezier(.4,0,.2,1) forwards}
@keyframes sweep{0%{left:-70%;opacity:1}100%{left:140%;opacity:1}}
.code{position:relative}
.code .tt{display:none;position:absolute;top:-8px;right:-8px;padding:1px 5px;border-radius:4px;background:#1d4ed8;color:#fff;font:600 7px Inter;letter-spacing:.1em}
.test .code .tt{display:block}
.foil{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;transition:opacity .9s ease;z-index:2}
.foil.gone{opacity:0;pointer-events:none}
.btn{margin-top:auto;min-width:min(260px,80%);padding:15px 26px;border:0;cursor:pointer;transition:opacity .5s,transform .5s cubic-bezier(.2,.8,.2,1)}
.btn.hide{opacity:0;transform:translateY(10px);pointer-events:none}
.btn:disabled{opacity:.5}
.ghost{background:none;border:0;cursor:pointer;margin-top:10px;padding:8px;font:500 13px Inter;text-decoration:underline;text-underline-offset:3px}
.hint{min-height:18px;margin:8px 0 10px;text-align:center;font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:0;transition:opacity .5s}
.hint.on{opacity:.8}
.state{margin-top:auto;margin-bottom:auto;text-align:center}
.fan{position:relative;flex:1;width:100%;min-height:calc(var(--ch)*1.1)}
.fan .face{width:var(--cw);height:var(--ch);left:50%;top:50%;right:auto;bottom:auto;margin:calc(var(--ch)*-.5) 0 0 calc(var(--cw)*-.5);transform-origin:50% 120%;animation:fanin 1s cubic-bezier(.2,.8,.2,1) both}
.fan .face:nth-child(1){transform:rotate(-12deg) translateX(-18%);animation-delay:.1s}
.fan .face:nth-child(2){transform:rotate(12deg) translateX(18%);animation-delay:.2s}
.fan .face:nth-child(3){transform:translateY(-4%);animation-delay:.3s}
@keyframes fanin{from{opacity:0;margin-top:calc(var(--ch)*-.33)}}
/* details */
form{width:100%;max-width:340px;margin:auto 0;display:flex;flex-direction:column;gap:14px}

.ferr{min-height:16px;font-size:12px;color:#ffd6d6;text-align:center}

.rd .rk{font-size:11px;letter-spacing:.24em;text-transform:uppercase;opacity:.8}
.rd .rp{margin-top:10px;white-space:pre-line}

<script>
"use strict";
(function () {
/* ═══ ScratchDeal play page · V1.0 New Jersey ═════════════════════════
   ?g=<slug>    welcome → name and mobile → the deck glides; Stop, pick a
                card; the database fixes the prize for that card (scratch_play)
                and it is printed under the scratch layer before scratching
                starts. One real play per mobile.
   ?preview=1   MarTech's setup preview: no database; it draws what MarTech
                posts and picks a prize by the odds.
   &test=1      a test play (marked test, uses no stock, works in any status). */
const $ = (id) => document.getElementById(id);
const esc = (x) => String(x == null ? "" : x).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const SB_URL = "https://qsxldzqdjdplffxqdokd.supabase.co", SB_KEY = "sb_publishable_6ng_3jnvQbJUZifYTxmRrw_0yhCZuY9";
const qs = new URLSearchParams(location.search), SLUG = (qs.get("g") || "").toLowerCase().replace(/[^a-z0-9-]/g, ""), PREVIEW = qs.get("preview") === "1";
const TESTLINK = qs.get("test") === "1";
const KEEP = "scratchdeal:" + SLUG;
const keep = (v) => { try { localStorage.setItem(KEEP, JSON.stringify(v)); } catch (e) {} };
const kept = () => { try { return JSON.parse(localStorage.getItem(KEEP) || "null"); } catch (e) { return null; } };
function rpc(fn, args) {
  return fetch(`${SB_URL}/rest/v1/rpc/${fn}`, { method: "POST",
    headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, "content-type": "application/json" }, body: JSON.stringify(args) })
    .then(async (r) => { const j = await r.json().catch(() => null); if (!r.ok) throw new Error((j && (j.message || j.hint)) || ("HTTP " + r.status)); return j; });
}

/* ── what each look starts with (MarTech fills the same words) ── */
const START = {

/* ── sound: soft, and only if the campaign has it on ── */

function label(ctx, w, h, txt, font, fill, y, ls) { ctx.save(); ctx.font = font; ctx.textAlign = "center"; ctx.textBaseline = "middle"; if ("letterSpacing" in ctx) ctx.letterSpacing = (ls || 0) + "px"; ctx.fillStyle = fill; ctx.fillText(txt, w / 2, y); ctx.restore(); }
const PAINT = {
  saffron(ctx, w, h) {

    label(ctx, w, h, "?", "700 " + Math.round(h * .76) + "px Oswald", "rgba(255,255,255,.08)", h / 2 + h * .16);
    const fs = Math.round(w * .145);

    label(ctx, w, h, "HERE", "700 " + fs + "px Oswald", "#fff", h / 2 + fs * .62, 3);
    const tiers = P.map((p) => String(p.big || "").replace(/\s*off\s*$/i, "").replace(/\s+/g, " ").trim()).filter(Boolean);

const mono = () => (String(cfg.card_word || L.card_word || cfg.brand_line || "M").trim().charAt(0) || "M").toUpperCase();

/* ── the quiet celebration: drifting motes ── */

    ps.push({ x: cx + Math.cos(a) * r * .9, y: cy + Math.sin(a) * r * 1.2, vx: (Math.random() - .5) * .25, vy: -(.15 + Math.random() * .45), s: .8 + Math.random() * 2.2, c: cols[i % cols.length], t: -Math.random() * 50, life: 150 + Math.random() * 120, tw: Math.random() * 6 }); }

/* ── words onto the page ── */

/* ── the deck ── */
const stage = $("stage"), cta = $("cta"), hint = $("hint"), dTop = $("dTop");

const offOf = (i) => { let o = ((i - idx) % N + N) % N; if (o > N / 2) o -= N; return o; };
function cardFront(i) {
  const n = "N° 0" + (i + 1);
  if (LOOK === "noir") return `<div class="f"><span class="k">${n}</span><div class="mono">${esc(mono())}</div><span class="nm">${esc(cfg.brand_line || "")}</span></div>`;
  if (LOOK === "bloom") return `<div class="f"><i class="bb a"></i><i class="bb b"></i><span class="k">0${i + 1}</span><span class="t">${esc(cfg.card_word || L.card_word)}</span></div>`;
  return `<div class="f"><span class="k">${n}</span><span class="q">?</span><div class="tear"><small>A MYSTERY</small><b>${esc(cfg.card_word || L.card_word)}</b></div></div>`;
}
function build() {
  stage.innerHTML = "";
  cards = [...Array(N)].map((_, i) => { const el = document.createElement("div"); el.className = "c";
    el.innerHTML = `<div class="face front v${i % 6}">${cardFront(i)}</div><div class="face back"><div class="prize"></div><canvas class="foil"></canvas></div>`;
    el.addEventListener("click", () => onCard(i)); stage.appendChild(el); return el; });
  gap = cards[0].offsetWidth * 1.09;
}
function layout(d) {
  cards.forEach((el, i) => { const o = offOf(i), a = Math.abs(o);
    el.style.setProperty("--d", d + "s");
    el.style.transform = `translateX(${o * gap}px) translateZ(${a ? -60 : 0}px) rotateY(${o * -4}deg)`;
    el.style.opacity = a > 1 ? 0 : 1; el.style.zIndex = 10 - a; el.style.pointerEvents = a > 1 ? "none" : "auto"; });
}
function step(dir, d) { idx = (idx + dir + N) % N; layout(d); tick(); }
const sp = () => SPEED[cfg.speed] || SPEED.normal;
function loop() { if (state !== "spin" && state !== "idle") return; step(1, sp()[1]); timer = setTimeout(loop, sp()[0] * 1000); }
function startDeck(asIdle) { clearTimeout(timer); state = asIdle ? "idle" : "spin"; timer = setTimeout(loop, 900); }
function stop() {
  if (state !== "spin") return; state = "slowing"; clearTimeout(timer); cta.classList.add("hide");
  const ds = [sp()[1] * 1.25, sp()[1] * 1.7]; let k = 0;
  (function slow() { step(1, ds[k]); const wait = ds[k] * 1000 + 120; k++;
    if (k < ds.length) timer = setTimeout(slow, wait);
    else timer = setTimeout(() => { state = "stopped"; cta.textContent = L.labels.pick; cta.classList.remove("hide"); say("Tap the side cards to switch"); }, wait); })();
}
function say(t) { hint.textContent = t || ""; hint.classList.toggle("on", !!t); }
function prizeHtml(r) {
  return `<small>${esc(r.kick || "")}</small><div class="big">${esc(r.big || r.label || "")}</div><em>${esc(r.line || "")}</em><div class="code">${esc(r.code || "")}<i class="tt">TEST</i></div>`;
}
function fitPrize(el) {
  const big = el.querySelector(".big"); if (!big) return; big.style.fontSize = "";
  let fs = parseFloat(getComputedStyle(big).fontSize); const room = el.clientWidth - 16;
  const kids = el.children, tall = () => kids[kids.length - 1].offsetTop + kids[kids.length - 1].offsetHeight - kids[0].offsetTop;

}
/* the card is picked: the database fixes the prize, it is printed under the scratch layer, then the card turns */
async function choose(i) {
  if (state !== "stopped") return; state = "choosing"; chosen = cards[i]; say(""); cta.classList.add("hide");
  let r;
  try {
    r = PREVIEW ? previewPrize() : await rpc("scratch_play", { p_slug: SLUG, p_name: nameI.value.trim(), p_mobile: digits(), p_card: i + 1, p_test: TESTLINK });
  } catch (err) {
    const k = Object.keys(ERR).find((x) => String(err.message).includes(x));
    state = "stopped"; cta.classList.remove("hide"); say(k ? ERR[k] : "Something went wrong. Check your connection and try again.");
    if (k === "scratch_closed" || k === "no_prizes_left") showState(ERR[k]);
    return;
  }
  result = { ...r, name: nameI.value.trim(), at: Date.now() };
  if (!PREVIEW && !r.test && !r.duplicate) keep(result);

function turn(i, r, revealed) {

  const pz = chosen.querySelector(".prize"); pz.innerHTML = prizeHtml(r);

  chosen.classList.add("chosen"); chosen.style.setProperty("--d", "1.1s"); chosen.style.transform = "translateX(0) translateY(-6px) scale(1.2) rotateY(180deg)";

  foil.reset();

}
function won(quiet) {
  state = "won"; $("app").classList.add("won"); chosen.classList.add("won"); dTop.style.opacity = 1;
  if (!quiet) { bell(L.bell); const r = chosen.getBoundingClientRect(), a = $("app").getBoundingClientRect(); if (stopMotes) stopMotes(); stopMotes = motes(r.left - a.left + r.width / 2, r.top - a.top + r.height / 2, L.motes); }

function onCard(i) { audio();

  else if (state === "spin") stop(); }
cta.addEventListener("click", () => { audio();
  if (state === "spin") stop(); else if (state === "stopped") choose(idx); else if (state === "won") openRedeem(); });

/* ── screens ── */
let screen = "welcome";
function show(id) { screen = id; document.querySelectorAll(".scr").forEach((s) => s.classList.toggle("on", s.id === id)); if (id === "deck" && !cards.length) { build(); layout(0); } stepMsg(id); }

/* ── details ── */
const nameI = $("name"), phoneI = $("phone"), goB = $("go");

const okName = () => nameI.value.trim().length >= 2, okPhone = () => /^[6-9]\d{9}$/.test(digits());

nameI.addEventListener("input", check);
function check() { goB.disabled = !(okName() && okPhone()); $("ferr").textContent = ""; }
const ERR = { bad_name: "Please enter your name.", bad_mobile: "Please enter a 10-digit mobile number.",
  scratch_closed: "This campaign has closed.", no_prizes_left: "All the prizes have been given. Thank you for joining in." };

  e.preventDefault(); if (goB.disabled) return;
  if (!$("ok").checked) { $("ferr").textContent = "Please tick the box to continue."; return; }
  audio(); show("deck"); resetDeck(); startDeck();
});

/* ── how to redeem ── */
function openRedeem() {
  if (!result) return;
  $("rdPrize").textContent = result.big || result.label || "";
  $("rdCode").textContent = result.code || "";
  $("rdNote").textContent = cfg.fine || "Show this at the counter";
  $("rdStub").textContent = result.test ? "Test code" : "Your code";
  $("rdHow").textContent = String(cfg.redeem_steps || "Show this code at billing" + (cfg.brand_line ? " at any " + cfg.brand_line + " store." : ".")).split(/\n+/).map((x) => x.trim()).filter(Boolean).join(" ");
  $("rdFine").textContent = cfg.redeem_fine || result.line || ""; $("rdFine").hidden = !$("rdFine").textContent;
  const lbl = (cfg.cta_label || "").trim(), url = (cfg.cta_url || "").trim();
  $("rdCta").textContent = lbl || (url ? "Visit " + url.replace(/^https?:\/\//, "").replace(/\/$/, "") : ""); $("rdCta").hidden = !url;
  $("rdCta").dataset.href = url ? (/^https?:/.test(url) ? url : "https://" + url) : "";
  $("rdAgain").hidden = !(PREVIEW || TESTING);
  show("redeem");
  requestAnimationFrame(() => { const b = $("rdCode"); b.style.fontSize = ""; let fs = 24; while (b.scrollWidth > b.parentNode.clientWidth - 4 && fs > 14) { fs--; b.style.fontSize = fs + "px"; } });
}
$("rdBack").addEventListener("click", () => show("deck"));
$("rdAgain").addEventListener("click", () => { if (PREVIEW) { show("deck"); resetDeck(); startDeck(); return; } show("form"); });
$("rdCta").addEventListener("click", () => { if ($("rdCta").dataset.href) window.open($("rdCta").dataset.href, "_blank", "noopener"); });

/* ── the MarTech preview ── */
function previewPrize() {
  const live = P.filter((p) => +p.weight > 0), tot = live.reduce((s, p) => s + +p.weight, 0);
  let x = Math.random() * tot, p = live[0] || P[0] || { big: "₹500 OFF", kick: "YOU GOT", line: "" };
  for (const q of live) { x -= +q.weight; if (x < 0) { p = q; break; } }
  return { ...p, code: (cfg.code_prefix || "WIN") + "-7Q4K", test: false, card: idx + 1 };
}
function goto(s) {
  clearTimeout(timer); if (s === "welcome" || s === "form") { show(s); if (s === "welcome") { if (!cards.length) build(); } return; }
  show("deck"); resetDeck();
  if (s === "deck") { startDeck(); return; }
  state = "stopped"; const r = previewPrize(); result = r; turn(0, r, s !== "scratch");
  if (s === "redeem") setTimeout(openRedeem, 1400);
}

/* ── start ── */
let TESTING = false;
function boot() {
  if (PREVIEW) {
    window.addEventListener("message", (e) => {
      if (e.data && e.data.type === "sd-preview") {
        const before = JSON.stringify({ look: cfg.look, cards: cfg.cards, word: cfg.card_word, bl: cfg.brand_line });
        applyGame(e.data.game);
        const after = JSON.stringify({ look: cfg.look, cards: cfg.cards, word: cfg.card_word, bl: cfg.brand_line });
        if (before !== after) goto(screen === "redeem" ? "redeem" : screen === "deck" ? (state === "won" ? "win" : state === "scratch" ? "scratch" : "deck") : screen);
      }
      if (e.data && e.data.type === "sd-goto") goto(e.data.step);
    });
    /* opened on its own (a template's Try button): that look, with its starting prizes */
    const lk = START[qs.get("look")] ? qs.get("look") : "saffron";
    const DEMO = { saffron: [["YOU GOT", "₹500 OFF", "On any order above ₹2,499", 60], ["YOU GOT", "₹1,000 OFF", "On any order above ₹4,999", 32], ["JACKPOT", "₹5,000 OFF", "On any order above ₹14,999", 8]],
      noir: [["YOUR PRIVILEGE", "15%", "off accessories", 50], ["YOUR PRIVILEGE", "20%", "off the new collection", 35], ["YOUR PRIVILEGE", "30%", "off your next look", 15]],
      bloom: [["FOR YOU", "Free gift wrap", "plus a handwritten note", 50], ["FOR YOU", "15% off", "everything in store", 35], ["FOR YOU", "A free silk scarf", "with your next order", 15]] };
    applyGame({ config: { look: lk, brand_line: "Your brand", code_prefix: "DEMO" }, prizes: DEMO[lk].map(([kick, big, line, weight], i) => ({ key: "p" + i, kick, big, line, weight })) });
    try { parent.postMessage({ type: "sd-ready" }, "*"); } catch (e) {}
    return;
  }
  if (!SLUG) { applyGame({ config: {} }); return showState("This link is missing its campaign.", "Scan the QR code again."); }
  rpc("scratch_open", { p_slug: SLUG }).then((g) => {
    if (!g) { applyGame({ config: {} }); return showState("This campaign isn't available."); }
    applyGame(g);
    if (!TESTLINK) {
      if (g.status === "draft") return showState("This campaign opens soon.");
      if (g.status === "closed" || g.status === "archived") return showState("This campaign has closed.", "Thank you for joining in.");
    }
    TESTING = g.status === "testing" || TESTLINK; $("testTag").hidden = !TESTING;
    if (TESTLINK) { try { localStorage.removeItem(KEEP); } catch (e) {} }
    /* someone who has already played sees their card again */
    const k = TESTING ? null : kept();
    if (k && k.code) { nameI.value = k.name || ""; show("deck"); resetDeck(); state = "stopped"; result = k; turn(Math.max(0, Math.min(N - 1, (k.card || 1) - 1)), k, true); }
  }).catch(() => { applyGame({ config: {} }); showState("Couldn't load the campaign.", "Check your connection and try again."); });
}
addEventListener("resize", () => { if (cards.length && !chosen) { gap = cards[0].offsetWidth * 1.09; layout(0); } });
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(boot);
})();
</script>
