<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Centre</title>
<!-- THE VERSION THE DEPLOY GUARD COMPARES. It lives here, not in the
     bundle, because a scan of the bundle finds a library's version
     instead — the guard once compared a dependency's v2.97 against
     itself and called it a match. Bump it every batch.

     The starter shipped WITHOUT this line until Rome, so every tool
     scaffolded from it would have failed the contract check on its
     first build. Found by scaffolding one and running the checks,
     which is the whole point of doing that. -->
<meta name="cc-tool-version" content="V11.31 Salzburg">
<!-- INSTALLABLE, WHICH IS THE OTHER HALF OF FULLSCREEN.
     Chrome on Android gives the Fullscreen API, so Play already takes
     the whole screen. Installed from the home screen this goes further:
     `display: standalone` means there is no address bar to escape in
     the first place, it launches faster, and the service worker's cache
     is what it opens from. On an iPhone — where the Fullscreen API is
     refused outright — this is the ONLY route to a chrome-less screen. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0D0D0D">
<link rel="icon" href="https://communicationcraftshq.github.io/BrandCalendar/icons/portfolio/favicon.ico?v=champagneF7" sizes="16x16 32x32 48x48 256x256">
<link rel="icon" type="image/png" sizes="32x32" href="https://communicationcraftshq.github.io/BrandCalendar/icons/portfolio/favicon-32x32.png?v=champagneF7">
<link rel="icon" type="image/png" sizes="16x16" href="https://communicationcraftshq.github.io/BrandCalendar/icons/portfolio/favicon-16x16.png?v=champagneF7">
<link rel="apple-touch-icon" sizes="180x180" href="https://communicationcraftshq.github.io/BrandCalendar/icons/portfolio/apple-touch-icon.png?v=champagneF7">
<!-- ══ V11.28 · THE ICON FONT NO LONGER HOLDS THE PAGE SHUT ══════════
     Chirag, 30 October: "The page takes terribly long time to load
     sometimes over one minute, but once it loads, I can move around
     the page and tabs easily."

     A <link rel="stylesheet"> BLOCKS THE FIRST PAINT. This one is on
     cdn.jsdelivr.net — a third party, on the far side of whatever is
     between Ahmedabad and their nearest edge — and the service worker
     deliberately ignores cross-origin requests, so it is never cached
     and every cold load asks them again. When they are slow the screen
     stays white, and when they answer everything is instantly fine.
     That is the shape of what he described.

     `media="print"` makes the browser fetch it without waiting for it:
     print styles cannot affect the screen, so the paint goes ahead.
     `onload` then promotes it to `all` and the icons appear. The page
     is usable a beat before its icons are, which is the right way
     round. `noscript` keeps it blocking where there is no JavaScript.

     preconnect opens the socket while the rest of the head is read, so
     the fetch starts sooner.

     THIS IS NOT PROVED TO BE THE CAUSE. It is worth doing whichever of
     the three suspects it turns out to be, and it is the only one that
     costs nothing to be wrong about. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css"
      rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" rel="stylesheet"></noscript>
<!-- THE SHARED STYLESHEET. Linked, never copied — the whole point of
     the kit. Change it once and every tool has it on next load.
     The drift checker fails a tool that inlines a copy instead. -->
<link rel="stylesheet" href="https://communicationcraftshq.github.io/BrandCalendar/cc-suite.css">
