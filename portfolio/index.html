<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio</title>
<!-- THE VERSION THE DEPLOY GUARD COMPARES. It lives here, not in the
     bundle, because a scan of the bundle finds a library's version
     instead — the guard once compared a dependency's v2.97 against
     itself and called it a match. Bump it every batch.

     The starter shipped WITHOUT this line until Rome, so every tool
     scaffolded from it would have failed the contract check on its
     first build. Found by scaffolding one and running the checks,
     which is the whole point of doing that. -->
<meta name="cc-tool-version" content="v5.29 — Kanpur: the drawer, and room to breathe">
<!-- INSTALLABLE, WHICH IS THE OTHER HALF OF FULLSCREEN.
     Chrome on Android gives the Fullscreen API, so Play already takes
     the whole screen. Installed from the home screen this goes further:
     `display: standalone` means there is no address bar to escape in
     the first place, it launches faster, and the service worker's cache
     is what it opens from. On an iPhone — where the Fullscreen API is
     refused outright — this is the ONLY route to a chrome-less screen. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0D0D0D">
<link rel="icon" href="https://communicationcraftshq.github.io/BrandCalendar/favicon.ico">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" rel="stylesheet">
<!-- THE SHARED STYLESHEET. Linked, never copied — the whole point of
     the kit. Change it once and every tool has it on next load.
     The drift checker fails a tool that inlines a copy instead. -->
<link rel="stylesheet" href="https://communicationcraftshq.github.io/BrandCalendar/cc-suite.css">
