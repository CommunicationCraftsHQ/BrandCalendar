<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="cc-tool-version" content="V1.0 New Jersey">
<title>Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap">
<style>
/* ═══ Registration · World Cities · MarTech V4.1 New Jersey (27 Oct 2026)
   One question per screen. A line-art skyline beside the logo draws itself
   as the seven answers come in; a red kite rises when it is complete. Each
   screen has its own world city in the footer. The last screen is a poster
   entry pass with two WhatsApp buttons. Every word comes from the campaign's
   setup in MarTech (reg_events.config); the design is fixed.
     ?g=<slug>     the campaign
     &test=1       a test registration (marked test, works in any status)
     ?preview=1    MarTech's setup preview: no database; draws what MarTech
                   sends (rg-preview), reports its screen (rg-step) and can
                   be moved to a screen (rg-goto). */
:root{--paper:#ffffff;--navy:#1f2d5c;--red:#ac1f25;--pink:#d89dc6;--ink:#141833;--muted:#6b7191;--line:#e4e5ee;--soft:#f6f6f9;
  --stroke:#8f95b5;--t-pink:#f7e1ee;--t-red:#f6d4d6;--t-blue:#e3ecf8;--t-yellow:#fbeec4;--t-green:#dff0e2;--t-sand:#f6ead6;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.page{min-height:100%;display:flex;flex-direction:column}
.wrap{flex:1;display:flex;flex-direction:column;width:100%;max-width:600px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-top:calc(24px + env(safe-area-inset-top,0px))}
header{display:flex;align-items:flex-end;gap:20px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;color:var(--navy);flex:none;min-height:34px}
.brand img{height:34px;width:auto;display:block}
.brand b{font-weight:800;font-size:17px;letter-spacing:.02em}
.cityline{flex:1;min-width:0;height:auto;max-height:64px;display:block;overflow:visible}
.cityline path{fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.cityline .ghost path{stroke:#d7d9e5}
.cityline .ink path{stroke:var(--navy)}
.cityline .rv{transition:width .9s cubic-bezier(.3,.7,.2,1)}
.cityline .kite path{stroke:var(--red);fill:none}
.cityline .kite path:first-child{fill:var(--red);fill-opacity:.15}
.cityline .kite{opacity:0;transform:translateY(12px);transition:opacity .6s .6s,transform .9s .6s cubic-bezier(.3,1.4,.5,1)}
.cityline.complete .kite{opacity:1;transform:none}
main{flex:1;display:flex;align-items:center;padding-block:36px}
form{width:100%}
.step{display:none;animation:in .4s cubic-bezier(.2,.8,.2,1)}
.step.active{display:block}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pay{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5;color:var(--muted);margin:36px 0 0;padding-top:18px;border-top:1px solid var(--line);max-width:46ch}
.pay:empty{display:none}
.pay svg{flex:none;width:16px;height:16px;margin-top:2px;color:var(--red)}
.pay b{color:var(--navy);font-weight:700}
.q{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:12px}
h1{font-weight:800;color:var(--navy);font-size:clamp(40px,9vw,60px);line-height:1;letter-spacing:-.025em;margin:0 0 16px}
h1 span{font-weight:300;display:block}
h1 span.a{font-weight:800}
h2{font-weight:700;color:var(--navy);font-size:clamp(28px,6vw,38px);line-height:1.12;letter-spacing:-.015em;margin:0 0 28px;text-wrap:balance}
.sub{color:var(--muted);font-size:15px;line-height:1.5;margin:-18px 0 22px}
.lead{color:var(--muted);font-size:17px;line-height:1.55;margin:0 0 28px;max-width:44ch}
.meta{list-style:none;margin:0 0 36px;padding:0;display:grid;gap:10px}
.meta li{display:flex;gap:12px;font-size:16px;color:var(--ink)}
.meta li span{width:56px;flex:none;color:var(--muted);font-size:14px;padding-top:1px}
input[type=text],input[type=email],input[type=tel]{width:100%;background:var(--paper);border:0;border-bottom:2px solid var(--line);border-radius:0;color:var(--navy);font:600 clamp(24px,5vw,30px)/1.3 var(--font);padding:8px 0 12px;outline:none;transition:border-color .2s}
input:focus{border-bottom-color:var(--navy)}
input::placeholder{color:#c3c6d6;font-weight:400}
.tel{display:flex;align-items:flex-end;gap:12px}
.tel em{font:400 clamp(24px,5vw,30px)/1.3 var(--font);font-style:normal;color:var(--muted);padding:8px 0 12px;border-bottom:2px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--navy);font:600 15px var(--font);padding:10px 14px;border-radius:6px;cursor:pointer;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--navy)}
.chip.sel{background:var(--navy);border-color:var(--navy);color:#fff}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:24px;cursor:pointer;font-size:15px;color:var(--ink);line-height:1.45}
.check input{width:18px;height:18px;accent-color:var(--red);margin:2px 0 0;flex:none}
.row{display:flex;align-items:center;gap:16px;margin-top:32px;flex-wrap:wrap}
.btn{appearance:none;border:0;background:var(--red);color:#fff;font:600 16px var(--font);padding:14px 26px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:10px;transition:background .2s}
.btn:hover{background:#951a1f}
.btn[disabled]{opacity:.6;cursor:default}
.btn svg{width:16px;height:16px}
.ghost{appearance:none;background:none;border:0;color:var(--muted);font:600 15px var(--font);cursor:pointer;padding:6px 2px}
.ghost:hover{color:var(--navy)}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:10px}
:focus-visible{outline:2px solid var(--navy);outline-offset:3px}
.opt{display:grid;gap:8px;margin-bottom:22px}
.opt .chip{text-align:left;padding:14px 16px 14px 44px;position:relative}
.opt .chip::before{content:"";position:absolute;left:16px;top:50%;width:16px;height:16px;margin-top:-8px;border:1.5px solid currentColor;border-radius:4px}
.opt .chip.sel::before{background:#fff;box-shadow:inset 0 0 0 3px var(--navy)}
/* guests */
.guests{display:grid;gap:10px;margin-bottom:6px}
.guest{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end;padding:12px 0;border-bottom:1px solid var(--line)}
.guest input{font-size:18px!important;padding:6px 0 8px!important}
.guest .x{appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;font-size:20px;padding:6px}
.add{appearance:none;border:1px dashed var(--muted);background:none;color:var(--navy);font:600 15px var(--font);padding:12px 16px;border-radius:6px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.add:hover{border-color:var(--navy)}
/* the pass */
#passbox{margin:4px 0 22px}
.epass{position:relative;overflow:hidden;animation:passin .8s cubic-bezier(.2,.9,.25,1.05) both}
@keyframes passin{from{opacity:0;transform:translateY(24px) rotate(-2deg) scale(.96)}to{opacity:1;transform:none}}
.epass::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-18deg);animation:shine 2.6s .9s ease-in-out 1 both;pointer-events:none}
@keyframes shine{to{left:130%}}
.epass .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.pass-poster{background:var(--red);color:#fff;border-radius:14px;aspect-ratio:4/5;max-width:340px;width:100%;display:flex;flex-direction:column;padding:22px;box-shadow:0 18px 40px rgba(172,31,37,.3);margin:0 auto}
.pass-poster .flags{position:absolute;top:0;right:0;width:58%;height:auto}
.pass-poster .crest{background:#fff;border-radius:6px;padding:3px;height:26px;width:auto;align-self:flex-start;position:relative;display:block}
.pass-poster .bl{align-self:flex-start;position:relative;font-weight:800;letter-spacing:.04em;font-size:15px}
.pass-poster .t{font-size:38px;line-height:.95;font-weight:800;letter-spacing:-.02em;margin-top:auto;position:relative;word-break:break-word}
.pass-poster .t span{font-weight:300;display:block}
.pass-poster .ev{font-size:13px;margin:10px 0 16px;opacity:.9;position:relative}
.pass-poster .card{background:#fff;color:var(--navy);padding:14px 16px;border-radius:8px;position:relative}
.pass-poster .card .k{color:var(--muted)}
.pass-poster .card .nm{font-size:24px;margin:2px 0 4px;font-weight:800;line-height:1.05;word-break:break-word;padding-right:76px}
.pass-poster .card .role{font-size:13px;color:var(--ink);word-break:break-word}
.pass-poster .card .no{position:absolute;right:14px;top:14px;font-size:12px;font-weight:800;color:var(--red);letter-spacing:.08em}
.pass-poster .test{position:absolute;top:14px;right:14px;z-index:2;background:#fff;color:var(--red);font-size:10px;font-weight:800;letter-spacing:.12em;padding:4px 8px;border-radius:4px}
.gl{max-width:440px;margin:0 0 22px;border-top:1px solid var(--line)}
.gl .g{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.gl .g div{flex:1;min-width:0}
.gl .g b{display:block;color:var(--navy);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gl .g small{color:var(--muted);font-size:13px;letter-spacing:.04em}
.gl .g a{flex:none;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--navy);font-weight:600;font-size:14px;border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.gl .g a svg{width:16px;height:16px;color:#25a244}
.glh{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.finbtns{display:grid;gap:10px;max-width:440px}
.finbtns a{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;font-weight:600;font-size:16px;padding:15px 18px;border-radius:6px}
.finbtns .wa-invite{background:var(--red);color:#fff;box-shadow:0 8px 20px rgba(172,31,37,.25)}
.finbtns .wa-invite:hover{background:#951a1f}
.finbtns .wa-save{border:1px solid var(--line);color:var(--navy)}
.finbtns .wa-save:hover{border-color:var(--navy)}
.finbtns .wa-save svg{color:#25a244}
.finbtns svg{width:20px;height:20px}
/* the footer: one world city per screen */
.foot{position:relative;height:clamp(110px,24vw,160px);margin-top:8px}
.foot svg{position:absolute;inset:0;width:100%;height:100%;opacity:0;transform:translateY(10px);transition:opacity .7s,transform .9s cubic-bezier(.2,.8,.2,1)}
.foot svg.on{opacity:1;transform:none}
.art path{fill:none;stroke:var(--stroke);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.art .t-pink{fill:var(--t-pink);stroke:none}.art .t-red{fill:var(--t-red);stroke:none}.art .t-blue{fill:var(--t-blue);stroke:none}
.art .paper{fill:var(--paper);stroke:none}
.art .t-yellow{fill:var(--t-yellow);stroke:none}.art .t-green{fill:var(--t-green);stroke:none}.art .t-sand{fill:var(--t-sand);stroke:none}
.note{color:var(--muted);font-size:16px;line-height:1.55}
body.loading main,body.loading .foot{visibility:hidden}
.testbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#4F7FD6;color:#fff;text-align:center;font:700 11px/1 var(--font);letter-spacing:.14em;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
@media (max-width:420px){header{gap:14px}.brand b{font-size:15px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="loading">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="arrow" viewBox="0 0 16 16"><path d="M2 8h11M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="tick" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4.8 8.2l2.1 2.1 4.3-4.6" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>

</defs></svg>

<div class="page">
<div class="wrap">
  <header>
    <div class="brand" id="brand"></div>
    <svg id="sky" aria-hidden="true"></svg>
  </header>
  <main>
    <form id="form" novalidate autocomplete="on">
      <section class="step active" data-step="intro">
        <div class="q" data-t="kicker"></div>
        <h1><span class="a" data-t="title_a"></span><span data-t="title_b"></span></h1>
        <p class="lead" data-t="lead"></p>
        <ul class="meta"><li><span>When</span><b data-t="when_line" style="font-weight:400"></b></li><li><span>Where</span><b data-t="where_line" style="font-weight:400"></b></li></ul>
        <button type="button" class="btn" data-next><span data-t="start_label"></span> <svg><use href="#arrow"/></svg></button>
      </section>
      <section class="step" data-step="name">
        <h2 data-t="q_name"></h2>
        <input type="text" id="f-name" placeholder="Your name" autocomplete="name" maxlength="80">
        <div class="err" data-err></div>
        <div class="row"><button type="button" class="btn" data-next>Next <svg><use href="#arrow"/></svg></button><span class="ghost" style="cursor:default;font-weight:400;font-size:13px">or press Enter</span></div>
        <div class="pay" data-pay></div>
      </section>
      <section class="step" data-step="phone">
        <h2 data-t="q_phone"></h2>
        <div class="tel"><em>+91</em><input type="tel" id="f-phone" inputmode="numeric" maxlength="11" placeholder="98765 43210" autocomplete="tel-national"></div>
        <div class="err" data-err></div>
        <div class="row"><button type="button" class="btn" data-next>Next <svg><use href="#arrow"/></svg></button><button type="button" class="ghost" data-back>Back</button></div>
        <div class="pay" data-pay></div>
      </section>
      <section class="step" data-step="email">
        <h2 data-t="q_email"></h2>
        <input type="email" id="f-email" placeholder="name@example.com" autocomplete="email" maxlength="120">
        <div class="err" data-err></div>
        <div class="row"><button type="button" class="btn" data-next>Next <svg><use href="#arrow"/></svg></button><button type="button" class="ghost" data-back>Back</button></div>
        <div class="pay" data-pay></div>
      </section>
      <section class="step" data-step="profession">
        <h2 data-t="q_prof"></h2>
        <div class="chips" data-chips="f-prof" id="profChips"></div>
        <input type="text" id="f-prof" placeholder="Or type your profession" maxlength="120">
        <div class="err" data-err></div>
        <div class="row"><button type="button" class="btn" data-next>Next <svg><use href="#arrow"/></svg></button><button type="button" class="ghost" data-back>Back</button></div>
        <div class="pay" data-pay></div>
      </section>
      <section class="step" data-step="org">
        <h2 id="orgQ"></h2>
        <input type="text" id="f-org" placeholder="Organisation / University" autocomplete="organization" maxlength="120">
        <div class="err" data-err></div>
        <div class="row"><button type="button" class="btn" data-next>Next <svg><use href="#arrow"/></svg></button><button type="button" class="ghost" data-back>Back</button></div>
        <div class="pay" data-pay></div>
      </section>
      <section class="step" data-step="city">
        <h2 data-t="q_city"></h2>
        <div class="chips" data-chips="f-city" id="cityChips"></div>
        <input type="text" id="f-city" placeholder="Or type your city" autocomplete="address-level2" maxlength="120">
        <div class="err" data-err></div>
        <div class="row"><button type="button" class="btn" data-next>Next <svg><use href="#arrow"/></svg></button><button type="button" class="ghost" data-back>Back</button></div>
        <div class="pay" data-pay></div>
      </section>
      <section class="step" data-step="state">
        <h2 data-t="q_state"></h2>
        <input type="text" id="f-state" placeholder="State" list="states" autocomplete="address-level1" maxlength="120">
        <datalist id="states"><option value="Gujarat"><option value="Maharashtra"><option value="Rajasthan"><option value="Madhya Pradesh"><option value="Delhi"><option value="Karnataka"><option value="Tamil Nadu"><option value="Telangana"><option value="Uttar Pradesh"><option value="West Bengal"></datalist>
        <label class="check" for="f-optin" id="optinRow"><input type="checkbox" id="f-optin"><span data-t="optin_label"></span></label>
        <div class="err" data-err></div>
        <div class="row"><button type="button" class="btn" data-next>Next <svg><use href="#arrow"/></svg></button><button type="button" class="ghost" data-back>Back</button></div>
        <div class="pay" data-pay></div>
      </section>
      <section class="step" data-step="guests">
        <h2 data-t="q_guests"></h2>
        <p class="sub" data-t="guests_sub"></p>
        <div class="guests" id="guests"></div>
        <button type="button" class="add" id="addGuest">+ Add a guest</button>
        <div class="err" data-err></div>
        <div class="row"><button type="button" class="btn" data-next id="guestNext">Next <svg><use href="#arrow"/></svg></button><button type="button" class="ghost" data-back>Back</button></div>
        <div class="pay" data-pay></div>
      </section>
      <section class="step" data-step="topics">
        <div class="q">Optional</div>
        <h2 data-t="q_topics"></h2>
        <p class="sub">Pick as many as you like</p>
        <div class="opt" id="topics"></div>
        <div class="err" data-err></div>
        <div class="row" style="margin-top:8px"><button type="button" class="btn" data-next id="submitBtn">Get my pass <svg><use href="#arrow"/></svg></button><button type="button" class="ghost" data-skip>Skip</button></div>
        <div class="pay" data-pay></div>
      </section>
      <section class="step" data-step="done">
        <div class="q" data-t="done_kicker"></div>
        <h2 id="doneTitle" style="margin-bottom:24px"></h2>
        <div id="passbox"></div>
        <div id="guestPasses"></div>
        <div class="finbtns">
          <a class="wa-save" id="wa-save" target="_blank" rel="noopener"><svg><use href="#wa"/></svg><span data-t="save_label"></span></a>
          <a class="wa-invite" id="wa-invite" target="_blank" rel="noopener"><svg><use href="#wa"/></svg><span data-t="invite_label"></span></a>
        </div>
        <div class="row"><button type="button" class="ghost" data-restart>Register someone else</button></div>
      </section>
      <section class="step" data-step="closed">
        <div class="q" data-t="kicker"></div>
        <h1><span class="a" data-t="title_a"></span><span data-t="title_b"></span></h1>
        <p class="note" data-t="closed_text"></p>
        <ul class="meta"><li><span>When</span><b data-t="when_line" style="font-weight:400"></b></li><li><span>Where</span><b data-t="where_line" style="font-weight:400"></b></li></ul>
      </section>
      <section class="step" data-step="missing">
        <h2>This page is not available.</h2>
        <p class="note">Check the link you were sent, or scan the QR code again.</p>
      </section>
    </form>
  </main>
</div>
<div class="foot art" id="foot" aria-hidden="true"></div>
</div>
<div class="testbar" id="testbar" hidden>TEST · THIS REGISTRATION IS NOT COUNTED</div>

<script>

    const m = String(x.message || "");
    if (/reg_closed/.test(m)) { go("closed"); }
    else errOn("topics", /bad_mobile/.test(m) ? "Your mobile number does not look right." : /bad_email/.test(m) ? "Your email address does not look right."
      : /bad_guest/.test(m) ? "One of your guests needs a name and a 10-digit mobile." : /reg_busy/.test(m) ? "Please press the button once more."
      : "Could not register just now. Check your connection and try again.");
  }
  sending = false; $("#submitBtn").disabled = false;
}
function next() {
  const key = order[cur];
  if (checks[key]) {
    const el = $(field[key]), v = el.value, ok = checks[key](v);
    if (ok !== true) { errOn(key, ok); if (!PREVIEW) el.focus(); return; }
    errOn(key, "");
    if (key === "city" && data.city !== v.trim()) { const c = [...document.querySelectorAll("#cityChips .chip")].find((x) => x.textContent === v.trim()); guess = c ? c.dataset.state : ""; delete data.state; $("#f-state").value = ""; }
    data[key] = key === "phone" ? v.replace(/\D/g, "").slice(-10) : v.trim();
    if (key === "state") data.opt_in = $("#f-optin").checked && !$("#optinRow").hidden;
  }
  if (key === "guests") {
    const gs = guestRows().filter((g) => g.name || g.mobile);
    const bad = gs.find((g) => g.name.length < 2 || !/^[6-9]\d{9}$/.test(g.mobile));
    if (bad) { errOn("guests", "Each guest needs a name and a 10-digit mobile."); return; }
    errOn("guests", ""); data.guests = gs;
  }
  const n = nextOf(key);
  if (key === "topics" || (n === "done")) return submit();
  go(n);
}
document.querySelectorAll("[data-next]").forEach((b) => b.addEventListener("click", next));
document.querySelectorAll("[data-back]").forEach((b) => b.addEventListener("click", () => go(prevOf(order[cur]))));
$("[data-skip]").addEventListener("click", () => { data.topics = []; paint(); submit(); });
$("#form").addEventListener("submit", (e) => e.preventDefault());
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing && e.target.type !== "checkbox" && e.target.tagName !== "A" && e.target.tagName !== "BUTTON") { e.preventDefault(); if (!["done", "closed", "missing"].includes(order[cur])) next(); } });
$("#f-phone").addEventListener("input", (e) => { let d = e.target.value.replace(/\D/g, "").slice(0, 10); e.target.value = d.length > 5 ? d.slice(0, 5) + " " + d.slice(5) : d; });
function chipSync() { document.querySelectorAll("[data-chips]").forEach((box) => { const v = document.getElementById(box.dataset.chips).value.trim(); box.querySelectorAll(".chip").forEach((x) => x.classList.toggle("sel", x.textContent === v)); }); }
document.querySelectorAll("[data-chips]").forEach((box) => {
  const inp = document.getElementById(box.dataset.chips);
  box.addEventListener("click", (e) => { const c = e.target.closest(".chip"); if (!c) return; inp.value = c.textContent; chipSync(); setTimeout(next, 250); });
  inp.addEventListener("input", chipSync);
});
$("#topics").addEventListener("click", (e) => { const c = e.target.closest(".chip"); if (!c) return; c.classList.toggle("sel"); data.topics = [...$("#topics").querySelectorAll(".chip.sel")].map((x) => x.textContent); });

function flags() { const f = '<path d="M18 0H60V20H18L0 42V22Z"/>'; let s = ""; [[0, 0], [60, 0], [120, 0], [60, 46], [120, 46], [120, 92]].forEach(([x, y]) => s += `<g transform="translate(${x} ${y})">${f}</g>`); return `<svg class="flags" viewBox="0 0 180 134" fill="rgba(216,157,198,.75)" aria-hidden="true">${s}</svg>`; }
function poster(name, sub, pass, test) {
  const top = C.logo_url ? `<img class="crest" alt="" src="${esc(C.logo_url)}">` : `<span class="bl">${esc(C.brand_line || "")}</span>`;
  return `<div class="epass pass-poster">${flags()}${top}${test ? '<span class="test">TEST</span>' : ""}<div class="t">${esc(C.title_a)} <span>${esc(C.title_b)}</span></div>
    <div class="ev">${esc([C.pass_when, C.pass_where].filter(Boolean).join(" · "))}</div>
    <div class="card"><span class="no">${esc(pass)}</span><div class="k">Entry pass</div><div class="nm">${esc(name)}</div><div class="role">${esc(sub)}</div></div></div>`;
}
const waNo = () => String(C.wa_number || "").replace(/\D/g, "");
const wa = (to, text) => "https://wa.me/" + (to || "") + "?text=" + encodeURIComponent(text);
function showPass() {
  if (!result) return;
  $("#doneTitle").textContent = fill(C.done_title);
  $("#passbox").innerHTML = poster(data.name, [data.profession, data.org].filter(Boolean).join(" · "), result.pass, result.test);
  const gs = result.guests || [];
  $("#guestPasses").innerHTML = gs.length ? `<div class="glh">Your guests</div><div class="gl">${gs.map((g) =>
    `<div class="g"><div><b>${esc(g.name)}</b><small>${esc(g.pass)}</small></div><a target="_blank" rel="noopener" href="${esc(wa(String(g.mobile).replace(/\D/g, ""),
      fill(C.guest_text).replace(/\{guest\}/g, g.name.split(/\s+/)[0]).replace(/\{pass\}/g, g.pass)))}"><svg><use href="#wa"/></svg>Send pass</a></div>`).join("")}</div>` : "";
  const ev = [TITLE, C.pass_when, C.pass_where].filter(Boolean).join(" · ");
  const save = fill(C.save_text) + "\n\nName: " + data.name + "\nPass no: " + result.pass + (data.profession ? "\nRole: " + data.profession : "") + (data.org ? "\nOrganisation: " + data.org : "")
    + (data.city ? "\nCity: " + data.city : "") + (gs.length ? "\nGuests: " + gs.map((g) => g.name + " (" + g.pass + ")").join(", ") : "") + "\n\n" + ev;
  $("#wa-save").href = wa(waNo(), save);
  $("#wa-invite").href = wa("", fill(C.invite_text));
}
$("[data-restart]").addEventListener("click", () => { for (const k of Object.keys(data)) delete data[k]; data.topics = []; guess = ""; result = null; $("#form").reset(); $("#guests").innerHTML = ""; guestLabel(); paint.done = false; paint(); go("name"); });

/* ── MarTech's preview ── */
function previewResult() { return { pass: (String(C.pass_prefix || "PASS").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8) || "PASS") + "-7Q4K", test: false, guests: (data.guests || []).map((g, i) => ({ ...g, pass: "PASS-" + "ABCDEFG"[i] + "2M8" })) }; }
function sample() {
  Object.assign(data, { name: "Riya Shah", phone: "9876543210", email: "riya@example.com", profession: (pairs(C.prof_options)[1] || pairs(C.prof_options)[0] || ["Architect"])[0], org: "Studio Lotus", city: (pairs(C.city_options)[0] || ["Ahmedabad"])[0], state: (pairs(C.city_options)[0] || ["", "Gujarat"])[1] || "Gujarat", opt_in: true, guests: [{ name: "Aman Mehta", mobile: "9123456780" }] });
  $("#f-name").value = data.name; $("#f-phone").value = "98765 43210"; $("#f-email").value = data.email; $("#f-prof").value = data.profession; $("#f-org").value = data.org; $("#f-city").value = data.city; $("#f-state").value = data.state;
  addGuest({ name: "Aman Mehta", mobile: "91234 56780" }); result = previewResult();
}
function gotoStep(k) { if (order.includes(k)) { if (k === "done") result = previewResult(); go(k); } }

guestLabel();
if (TESTLINK) $("#testbar").hidden = false;
if (PREVIEW) {
  document.body.classList.remove("loading");
  sample(); paint(); show(0);
  window.addEventListener("message", (e) => {
    if (e.data && e.data.type === "rg-preview") { C = Object.assign({}, DEFAULTS, e.data.config || {}); TITLE = e.data.title || ""; paint.done = false; paint(); progress(); }
    if (e.data && e.data.type === "rg-goto") gotoStep(e.data.step);
  });
  try { parent.postMessage({ type: "rg-ready" }, "*"); } catch (e) {}
} else if (!SLUG) { paint(); go("missing"); document.body.classList.remove("loading"); }
else {
  paint(); show(0);
  rpc("reg_open", { p_slug: SLUG }).then((g) => {
    if (!g) { go("missing"); return; }
    C = Object.assign({}, DEFAULTS, g.config || {}); TITLE = g.title || ""; STATUS = g.status; paint.done = false; paint();
    if (!["live", "testing"].includes(STATUS) && !TESTLINK) go("closed");
    if (STATUS === "testing") $("#testbar").hidden = false;
    document.body.classList.remove("loading");
  }).catch(() => { go("missing"); }).finally(() => document.body.classList.remove("loading"));
}
})();
</script>
</body>
</html>
