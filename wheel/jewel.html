<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spin the wheel</title>
<meta name="cc-tool-version" content="V1.9 New Jersey">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap">
<style>
:root{
  --wine:#59131D; --wine-deep:#3D0B13; --wine-hi:#6E1D29; --wine-seg-a:#5E1722; --wine-seg-b:#4C1019;
  --gold-hi:#F8E2A6; --gold:#D9B060; --gold-lo:#A97A2C;
  --gold-grad:linear-gradient(100deg,#F8E2A6 0%,#E3BF74 45%,#B98A35 100%);
  --ink:#F6E9CF; --ink-soft:rgba(246,233,207,.62); --ink-mute:rgba(246,233,207,.38);
  --line:rgba(217,176,96,.38);
  --serif:"Cormorant Garamond",Georgia,serif; --sans:"Jost",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--wine-deep);color:var(--ink);font-family:var(--sans);font-weight:300;overflow:hidden}
button,input{font:inherit;color:inherit}
#app{position:relative;max-width:440px;height:100dvh;margin:0 auto;overflow:hidden;
  background:radial-gradient(120% 70% at 50% 42%,#6A1A26 0%,var(--wine) 45%,var(--wine-deep) 100%)}
body:not(.ready) .scr{visibility:hidden}
#dust{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}

/* ── screens ── */
.scr{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;
  padding:calc(28px + env(safe-area-inset-top)) 28px calc(26px + env(safe-area-inset-bottom));
  opacity:0;pointer-events:none;transform:translateY(14px);transition:opacity .7s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.scr.on{opacity:1;pointer-events:auto;transform:none}
.mark{width:min(62%,250px);height:auto;display:block}
.mark.sm{width:132px}
.kicker{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-soft);font-weight:400}
.h1{font-family:var(--serif);font-weight:500;font-size:44px;line-height:1.02;margin:0;text-align:center;letter-spacing:-.005em}
.h1 i{font-style:italic;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:17px;line-height:1.5;color:var(--ink-soft);text-align:center;max-width:290px;margin:0}
.btn{appearance:none;border:0;cursor:pointer;width:100%;max-width:320px;height:54px;border-radius:999px;
  background:var(--gold-grad);color:#3A0A12;font-weight:500;font-size:13px;letter-spacing:.28em;text-transform:uppercase;
  box-shadow:0 10px 30px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .2s,filter .3s}
.btn:active{transform:scale(.98)}
.btn[disabled]{filter:grayscale(.6) brightness(.7);cursor:default}
.ghost{appearance:none;background:none;border:0;color:var(--ink-soft);font-size:13px;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;padding:10px}
.foot{margin-top:auto;width:180px;opacity:.8}

/* welcome */
#welcome .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;width:100%}
.halo{position:relative;width:250px;height:250px;margin:6px 0 4px}
.halo svg{position:absolute;inset:0;width:100%;height:100%}
.halo .spin{animation:slow 40s linear infinite}
@keyframes slow{to{transform:rotate(360deg)}}

/* form */
#form .stage{flex:1;width:100%;display:flex;flex-direction:column;justify-content:center;gap:30px}
.field{position:relative;border-bottom:1px solid var(--line);padding:22px 0 10px;transition:border-color .3s}
.field:focus-within{border-color:var(--gold)}
.field label{position:absolute;left:0;top:28px;font-size:18px;color:var(--ink-mute);transition:all .25s;pointer-events:none}
.field input{width:100%;background:none;border:0;outline:0;font-size:27px;font-family:var(--serif);font-weight:500;letter-spacing:.01em;padding:0}
.field input:focus+label,.field input:not(:placeholder-shown)+label{top:0;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.field.ph input{padding-left:62px;letter-spacing:.06em}
.field.ph .cc{position:absolute;left:0;bottom:11px;font-family:var(--serif);font-size:27px;color:var(--ink-soft)}
.field.ph label{left:62px}
.field input:focus+label{left:0}
.field.bad{border-color:#E08A7A}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:13px;line-height:1.5;color:var(--ink-soft);cursor:pointer}
.consent input{appearance:none;flex:none;width:18px;height:18px;margin:1px 0 0;border:1px solid var(--gold);border-radius:4px;display:grid;place-items:center;cursor:pointer}
.consent input:checked{background:var(--gold-grad)}
.consent input:checked::after{content:"";width:8px;height:4px;border:solid #3A0A12;border-width:0 0 1.6px 1.6px;transform:rotate(-45deg) translate(1px,-1px)}

/* wheel */
#wheel{gap:0}
#wheel .top{display:flex;flex-direction:column;align-items:center;gap:14px}
.hint{display:none}
.wheel-wrap{position:relative;flex:1;margin:0 -28px;width:calc(100% + 56px);display:flex;align-items:center;justify-content:center;min-height:0;container-type:inline-size}
.dial{position:relative;flex:none;aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none}
/* A · whole wheel, as wide as the phone */
#wheel[data-lay=a] .dial{width:min(94cqw,62dvh)}
/* B · close-up: bigger than the phone, the sides run off the edges */
#wheel[data-lay=b] .dial{width:128cqw}
/* C · rising: a huge wheel rising from the bottom, its centre just on screen */
#wheel[data-lay=c] .wheel-wrap{display:block}
#wheel[data-lay=c] .dial{position:absolute;width:170cqw;left:-35cqw;bottom:calc(-85cqw + 96px)}
#wheel[data-lay=c] .foot{display:none}
/* D · headline above a whole wheel */
#wheel .lay-head{display:none;text-align:center;margin-top:18px}
#wheel[data-lay=d] .lay-head{display:block}
#wheel[data-lay=d] .dial{width:min(90cqw,50dvh)}
#spinBtn{display:none;position:absolute;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);width:calc(100% - 96px);max-width:260px;z-index:3}
#wheel[data-lay=c] #spinBtn{display:block}
#wheel.zoom #spinBtn{opacity:0;pointer-events:none;transition:opacity .4s}
.dial svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dial svg.pointer{position:absolute;inset:auto;height:auto;left:50%;top:-5%;width:10.5%;transform:translateX(-50%);transform-origin:50% 22%;z-index:3;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35));transition:transform .08s}
.dial svg.pointer.flick{transform:translateX(-50%) rotate(-14deg)}
.hub{position:absolute;left:50%;top:50%;width:21%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;z-index:2;
  background:radial-gradient(circle at 40% 32%,#7A2331,#4A0F19 70%,#33070F 100%);box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 0 0 1.5px #D9B060,inset 0 0 0 4px rgba(61,11,19,.9),inset 0 0 0 5px rgba(217,176,96,.45);
  display:grid;place-items:center;transition:transform .25s}
.hub:active{transform:translate(-50%,-50%) scale(.95)}
.hub svg{position:static;width:58%;height:58%}
.hub.idle svg{animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(1)}50%{transform:scale(.84)}}
.dial .rimlight{position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:1;
  background:conic-gradient(from 300deg,transparent 0deg,rgba(255,240,200,.16) 30deg,transparent 70deg,transparent 180deg,rgba(255,240,200,.08) 210deg,transparent 240deg);
  -webkit-mask:radial-gradient(circle,transparent 61%,#000 62%,#000 100%);mask:radial-gradient(circle,transparent 61%,#000 62%,#000 100%)}
/* the win: the camera moves in on the wheel, the wheel stays, and the winning piece lifts out of it */
.dial{transition:transform 1.5s cubic-bezier(.65,0,.25,1)}
#rotor > *{transition:opacity .9s}
#wheel.zoom #rotor > .fade{opacity:.42!important}
#wheel.zoom .dial svg.pointer,#wheel.zoom .rimlight,#wheel.zoom .foot,#wheel.zoom .hint,#wheel.zoom .lay-head{opacity:0!important;transition:opacity .5s}
#wheel.zoom .hub{opacity:.5;transition:opacity .9s}
.outline{fill:none;stroke:url(#gg);stroke-width:1.5;stroke-dasharray:1;stroke-dashoffset:1}
#wheel.zoom .outline{stroke-dashoffset:0;transition:stroke-dashoffset 1.8s cubic-bezier(.6,0,.2,1) .9s}
#scrim{position:absolute;left:0;right:0;bottom:0;height:42%;z-index:3;pointer-events:none;opacity:0;transition:opacity 1s .6s;
  background:linear-gradient(180deg,rgba(61,11,19,0),rgba(61,11,19,.88) 45%,#3D0B13)}
#wheel.zoom #scrim{opacity:1}

/* the message, written into the segment */
#msg{position:absolute;inset:0;z-index:4;pointer-events:none}
#msg.on .act{pointer-events:auto}
#msg .in,#msg .act{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;text-align:center}
#msg .act{width:calc(100% - 56px);max-width:320px;top:auto!important;bottom:calc(26px + env(safe-area-inset-bottom))}
#msg .r{opacity:0;transform:translateY(8px)}
#msg.on .r{opacity:1;transform:none;transition:opacity .8s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
#msg.on .r1{transition-delay:1.5s}#msg.on .r2{transition-delay:1.75s}#msg.on .r3{transition-delay:2.15s}#msg.on .r4{transition-delay:2.4s}#msg.on .r5{transition-delay:2.65s}#msg.on .r6{transition-delay:2.9s}
#msg .spark{width:16px;height:16px;margin:8px 0 10px}
/* V1.8: after Done the light keeps moving and a next step appears */
#msg.on .spark{animation:twinkle2 2.8s ease-in-out 3.2s infinite}
@keyframes twinkle2{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(1.35) rotate(18deg);opacity:.7}}
#msg .gone{opacity:0!important;transform:translateY(8px)!important;pointer-events:none;transition:opacity .5s,transform .5s!important}
#welcome .kicker,#form .kicker{font-size:12px;letter-spacing:.26em;color:var(--gold)}
#redeem{justify-content:flex-start;gap:18px;overflow-y:auto}
#redeem .rd-prize{font-family:var(--serif);font-weight:500;font-size:42px;line-height:1;text-align:center;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0 0}
#redeem .rd-sub{font-size:16px;color:var(--ink);text-align:center;margin:0}
#redeem .code{margin:4px 0 0}
#redeem ol{list-style:none;counter-reset:s;margin:6px 0 0;padding:0;width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px}
#redeem li{counter-increment:s;display:flex;gap:14px;align-items:flex-start;font-size:16px;line-height:1.45;color:var(--ink)}
#redeem li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font-family:var(--serif);font-size:16px;font-weight:600;color:var(--gold-hi)}
#redeem .rd-fine{font-size:13px;line-height:1.5;color:var(--ink-soft);text-align:center;max-width:320px;margin:0}
#redeem .rd-acts{margin-top:auto;width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:8px}
.btn.line{background:none;border:1px solid var(--gold);color:var(--gold-hi);box-shadow:none;position:relative;overflow:hidden}
.btn.line::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,240,200,.35),transparent);animation:btnsheen 3.4s ease-in-out 1s infinite}
#app.redeeming #msg{opacity:0;pointer-events:none;transition:opacity .4s}
#app.redeeming #msg .act{pointer-events:none}
#after{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;opacity:0;transform:translateY(10px);transition:opacity .8s ease .2s,transform .9s cubic-bezier(.2,.7,.2,1) .2s}
#after.show{opacity:1;transform:none}
#after .btn{background:none;border:1px solid var(--gold);color:var(--gold-hi);box-shadow:none;position:relative;overflow:hidden}
#after .btn::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,240,200,.35),transparent);animation:btnsheen 3.4s ease-in-out 1s infinite}
@keyframes btnsheen{0%{left:-60%}55%,100%{left:130%}}
#msg .detail{font-size:16px;line-height:1.45;margin:0;color:var(--ink)}
#msg .kicker{font-size:13px;letter-spacing:.22em;color:var(--ink)}
.prize{font-family:var(--serif);font-weight:500;font-size:58px;line-height:.98;margin:10px 0 0;
  background:linear-gradient(100deg,#F8E2A6 0%,#D9B060 34%,#FFF8E4 50%,#F8E2A6 62%,#D9B060 100%);background-size:250% 100%;background-position:100% 0;
  -webkit-background-clip:text;background-clip:text;color:transparent}
#msg.on .prize{animation:sweep 2.6s ease 1.9s both}
@keyframes sweep{from{background-position:100% 0}to{background-position:0 0}}
.prize small{display:block;font-family:var(--sans);font-weight:400;font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-top:10px;font-size:16px;font-weight:500;color:var(--gold);-webkit-text-fill-color:var(--gold)}
.detail{font-size:14px;line-height:1.55;color:var(--ink-soft);margin:0 0 16px}
.code{display:inline-flex;flex-direction:column;gap:4px;border:1px dashed var(--line);border-radius:10px;padding:10px 22px;margin-bottom:18px}
.code b{font-family:var(--serif);font-weight:600;font-size:31px;letter-spacing:.18em;color:var(--ink)}
.code span{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-hi);font-weight:400}
#msg .btn{height:48px}
#msg.lose .prize{font-size:44px!important}

/* text wordmark when the setup has no logo */
.wm{font-family:var(--serif);font-weight:600;font-size:40px;letter-spacing:.02em;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
.wm.sm{font-size:24px}
[hidden]{display:none!important}
.ferr{min-height:18px;font-size:13px;color:#F0A08F;text-align:center}
#stateSub{margin-top:-6px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="gg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8E2A6"/><stop offset=".5" stop-color="#E0BB6E"/><stop offset="1" stop-color="#A97A2C"/>
    </linearGradient>
    <filter id="liftShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="16" stdDeviation="13" flood-color="#12020a" flood-opacity=".85"/>
    </filter>
    <radialGradient id="liftFill" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#7A2331"/><stop offset="1" stop-color="#4E1019"/>
    </radialGradient>
    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="-140" y1="0" x2="140" y2="0">
      <stop offset="0" stop-color="#FFF4D6" stop-opacity="0"/><stop offset=".5" stop-color="#FFF4D6" stop-opacity=".28"/><stop offset="1" stop-color="#FFF4D6" stop-opacity="0"/>
    </linearGradient>
    <symbol id="star" viewBox="-50 -50 100 100">
      <path d="M44.5 -35C8.5 -6.7 -3.4 -4.9 -18 -26C-3.4 -4.9 -7.9 6.1 -41.5 32C-7.9 6.1 4.2 4.6 22 24C4.2 4.6 8.5 -6.7 44.5 -35Z"/>
    </symbol>
  </defs>
</svg>

<div id="app">
  <canvas id="dust"></canvas>

  <!-- 1 · welcome -->
  <section class="scr on" id="welcome">
    <div class="stage">
      <img class="mark mk" data-img="mark" alt=""><div class="wm mk" hidden></div>
      <div class="halo" aria-hidden="true">
        <svg viewBox="-130 -130 260 260" class="spin" id="haloSvg"></svg>
      </div>
      <div class="kicker" id="wKick">Spin &amp; win</div>
      <h1 class="h1" id="head" style="margin-top:-10px">Spin for a <i>little sparkle</i></h1>
      <p class="sub" id="wSub"></p>
      <p class="sub" id="stateSub" hidden></p>
    </div>
    <button class="btn" id="begin">Begin</button>
  </section>

  <!-- 2 · details -->
  <section class="scr" id="form">
    <img class="mark sm mk" data-img="mark" alt=""><div class="wm sm mk" hidden></div>
    <form class="stage" id="f" novalidate>
      <div>
        <h2 class="h1" style="font-size:40px" id="fHead">Unlock your <i>spin</i></h2>
        <p class="sub" id="fSub" style="margin:14px auto 0"></p>
      </div>
      <div>
        <div class="field" id="fName"><input id="name" placeholder=" " autocomplete="name"><label for="name">Your name</label></div>
        <div class="field ph" id="fPhone"><span class="cc">+91</span><input id="phone" placeholder=" " inputmode="numeric" maxlength="11" autocomplete="tel-national"><label for="phone">Mobile number</label></div>
      </div>
      <label class="consent"><input type="checkbox" id="ok" checked><span id="consentTxt">I agree to be contacted about my prize.</span></label>
      <div class="ferr" id="ferr"></div>
      <button class="btn" id="go" disabled>Unlock my spin</button>
    </form>
  </section>

  <!-- 3 · wheel -->
  <section class="scr" id="wheel" data-lay="a">
    <div class="top">
      <img class="mark sm mk" data-img="mark" alt=""><div class="wm sm mk" hidden></div>
      <div class="kicker hint" id="hint"></div>
    </div>
    <div class="wheel-wrap">
      <div class="dial" id="dial">
        <svg class="pointer" id="pointer" viewBox="-24 -26 48 62" aria-hidden="true">
          <path d="M-13-6A15 15 0 1 1 13-6L0 33Z" fill="url(#gg)"/>
          <circle cx="0" cy="-12" r="5.5" fill="#4A0F19"/>
        </svg>
        <svg viewBox="-200 -200 400 400"><g id="rotor"></g><g filter="url(#liftShadow)"><g id="lift"></g></g></svg>
        <div class="rimlight"></div>
        <div class="hub idle" id="hub" role="button" aria-label="Spin"><svg viewBox="-50 -50 100 100"><use href="#star" x="-50" y="-50" width="100" height="100" fill="url(#gg)"/></svg></div>
      </div>
    </div>
    <img class="foot" data-img="badge" alt="" hidden>
    <div id="scrim"></div>
    <button class="btn" id="spinBtn">Spin</button>
  </section>

  <!-- 5 · how to redeem (V1.9) -->
  <section class="scr" id="redeem">
    <img class="mark sm mk" data-img="mark" alt=""><div class="wm sm mk" hidden></div>
    <div class="kicker" style="margin-top:6px">How to redeem</div>
    <div class="rd-prize" id="rdPrize"></div>
    <p class="rd-sub" id="rdSub"></p>
    <div class="code"><b id="rdCode"></b><span id="rdCodeNote">Your prize code</span></div>
    <ol id="rdSteps"></ol>
    <p class="rd-fine" id="rdFine"></p>
    <div class="rd-acts">
      <button class="btn line" id="cta" hidden>Explore the collection</button>
      <button class="ghost" id="rdBack">Back to my prize</button>
    </div>
  </section>

  <!-- 4 · result: written into the winning segment -->
  <div id="msg">
    <div class="in" id="msgIn">
      <div class="kicker r r1" id="rFor"></div>
      <div class="prize r r2" id="rPrize"></div>
      <svg class="spark r r3" viewBox="-50 -50 100 100"><use href="#star" x="-50" y="-50" width="100" height="100" fill="url(#gg)"/></svg>
      <p class="detail r r4" id="rDetail"></p>
    </div>
    <div class="act" id="msgAct">
      <div class="code r r5" id="rCode"><b id="rCodeTxt"></b><span id="rCodeNote">Show this at the counter</span></div>
      <div class="r r6" style="width:100%" id="doneRow"><button class="btn" id="done">Redeem</button></div>
    </div>
  </div>
</div>

<script>
"use strict";
(function () {
/* ═══ WheelDeal · the Jewel look · V1.7 New Jersey ═══════════════════
   A fresh template beside Gold, Neon and Pop (Chirag, 24 Oct 2026, from
   "03 - Jewelchic WheelDeal - mockup.html"). wheel/index.html sends a
   wheel whose look is "jewel" here, with the same address query.

   ?g=<wheel>   welcome → name and mobile → swipe the wheel → the winning
                piece lifts out of the wheel and the prize is written on it.
                The database picks the prize (wheel_spin); the wheel is
                steered onto it. One spin per mobile.
   ?preview=1   MarTech's setup preview: no database, it draws what
                MarTech posts and spins by the odds.
   &test=1      a test spin (marked test, uses no stock). */
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const pt = (r, deg) => { const a = (deg - 90) * Math.PI / 180; return [r * Math.cos(a), r * Math.sin(a)]; };
const esc = (x) => String(x == null ? "" : x).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

const SB_URL = "https://qsxldzqdjdplffxqdokd.supabase.co", SB_KEY = "sb_publishable_6ng_3jnvQbJUZifYTxmRrw_0yhCZuY9";
const qs = new URLSearchParams(location.search), SLUG = (qs.get("g") || "").toLowerCase().replace(/[^a-z0-9-]/g, ""), PREVIEW = qs.get("preview") === "1";
const KEEP = "wheeldeal:" + SLUG;
const keep = (v) => { try { localStorage.setItem(KEEP, JSON.stringify(v)); } catch (e) {} };

$("rdBack").addEventListener("click", () => { $("app").classList.remove("redeeming"); show("wheel"); });
$("cta").addEventListener("click", () => { if ($("cta").dataset.href) window.open($("cta").dataset.href, "_blank", "noopener"); });

/* someone who has already spun sees their result again */
function replay(res) {
  result = res; unlocked = true; show("wheel");
  if (res.index >= 0 && res.index < N) {
    rot = -(res.index * SEG + SEG / 2); rotor.setAttribute("transform", `rotate(${rot})`);
    $("hint").style.opacity = 0; hub.classList.remove("idle");
    setTimeout(() => land(res.index, false), 600);
  }
}

/* swipe: the wheel follows the finger, and a flick sets it going */
let drag = null;
const angAt = (e) => { const r = dial.getBoundingClientRect(); return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) * 180 / Math.PI; };
dial.addEventListener("pointerdown", (e) => {
  if (spinning || spent || e.target.closest("#hub")) return;
  dial.setPointerCapture(e.pointerId); drag = { a: angAt(e), hist: [{ t: performance.now(), r: rot }] };
});
dial.addEventListener("pointermove", (e) => {
  if (!drag) return; let dd = angAt(e) - drag.a; if (dd > 180) dd -= 360; if (dd < -180) dd += 360;
  drag.a += dd; const r = rot + dd; if (setRot(r)) tick(.3);
  drag.hist.push({ t: performance.now(), r }); if (drag.hist.length > 8) drag.hist.shift();
});
const release = () => {
  if (!drag) return; const h = drag.hist, a = h[0], b = h[h.length - 1]; drag = null;
  const v = (b.r - a.r) / Math.max(16, b.t - a.t);
  if (Math.abs(v) > .25) spin(Math.sign(v), Math.abs(v));
};
dial.addEventListener("pointerup", release); dial.addEventListener("pointercancel", release);
hub.addEventListener("click", () => spin(1, 1.2));
$("spinBtn").addEventListener("click", () => spin(1, 1.2));

/* ── start ── */
function boot() {
  if (PREVIEW) {
    window.addEventListener("message", (e) => {
      if (e.data && e.data.type === "wd-preview") { const at = screen; applyGame(e.data.game); show(at === "form" ? "welcome" : at); unlocked = true; }
    });
    applyGame({ config: {}, prizes: [] });
    try { parent.postMessage({ type: "wd-ready" }, "*"); } catch (e) {}
    return;
  }
  if (!SLUG) return showState("This link is missing its wheel.", "Scan the QR code again.");
  rpc("wheel_open", { p_slug: SLUG }).then((g) => {
    if (!g) return showState("This wheel isn't available.");
    applyGame(g);
    if (g.status === "draft") return showState("This wheel opens soon.");
    if (g.status === "closed") return showState("This wheel has closed.", "Thank you for joining in.");
    live = true;
    const k = kept(); if (k && k.code !== undefined && k.index !== undefined) replay(k);
  }).catch(() => showState("Couldn't load the wheel.", "Check your connection and try again."));
}
addEventListener("resize", () => { if (!spent) size(); });
boot();
})();
</script>
