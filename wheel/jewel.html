<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spin the wheel</title>
<meta name="cc-tool-version" content="V2.6 New Jersey">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500&display=swap">
<style>
:root{
  --wine:#59131D; --wine-deep:#3D0B13; --wine-hi:#6E1D29; --wine-seg-a:#5E1722; --wine-seg-b:#4C1019;
  --gold-hi:#F8E2A6; --gold:#D9B060; --gold-lo:#A97A2C;
  --gold-grad:linear-gradient(100deg,#F8E2A6 0%,#E3BF74 45%,#B98A35 100%);
  --ink:#F6E9CF; --ink-soft:rgba(246,233,207,.62); --ink-mute:rgba(246,233,207,.38);
  --line:rgba(217,176,96,.38);
  --serif:"Cormorant Garamond",Georgia,serif; --sans:"Jost",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--wine-deep);color:var(--ink);font-family:var(--sans);font-weight:300;overflow:hidden}
button,input{font:inherit;color:inherit}
#app{position:relative;max-width:440px;height:100dvh;margin:0 auto;overflow:hidden;
  background:radial-gradient(120% 70% at 50% 42%,#6A1A26 0%,var(--wine) 45%,var(--wine-deep) 100%)}
body:not(.ready) .scr{visibility:hidden}
/* V2.0: Testing — a small tag, and spin again as often as you like */
#testTag{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:9;font-size:10px;letter-spacing:.24em;text-transform:uppercase;font-weight:500;
  color:#3A0A12;background:var(--gold-grad);border-radius:999px;padding:5px 10px}
.tt{font-family:var(--sans);font-size:.42em;letter-spacing:.16em;vertical-align:middle;margin-left:.5em;padding:3px 7px;border-radius:6px;background:rgba(217,176,96,.18);color:var(--gold-hi)}
#dust{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}

/* ── screens ── */
.scr{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;
  padding:calc(28px + env(safe-area-inset-top)) 28px calc(26px + env(safe-area-inset-bottom));
  opacity:0;pointer-events:none;transform:translateY(14px);transition:opacity .7s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.scr.on{opacity:1;pointer-events:auto;transform:none}
.mark{width:min(62%,250px);height:auto;display:block}
.mark.sm{width:132px}
.kicker{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-soft);font-weight:400}
.h1{font-family:var(--serif);font-weight:500;font-size:44px;line-height:1.02;margin:0;text-align:center;letter-spacing:-.005em}
.h1 i{font-style:italic;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:17px;line-height:1.5;color:var(--ink-soft);text-align:center;max-width:290px;margin:0}
.btn{appearance:none;border:0;cursor:pointer;width:100%;max-width:320px;height:54px;border-radius:999px;
  background:var(--gold-grad);color:#3A0A12;font-weight:500;font-size:13px;letter-spacing:.28em;text-transform:uppercase;
  box-shadow:0 10px 30px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .2s,filter .3s}
.btn:active{transform:scale(.98)}
.btn[disabled]{filter:grayscale(.6) brightness(.7);cursor:default}
.ghost{appearance:none;background:none;border:0;color:var(--ink-soft);font-size:13px;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;padding:10px}
.foot{margin-top:auto;width:180px;opacity:.8}

/* welcome */
#welcome .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;width:100%}
.halo{position:relative;width:250px;height:250px;margin:6px 0 4px}
.halo svg{position:absolute;inset:0;width:100%;height:100%}
.halo .spin{animation:slow 40s linear infinite}
@keyframes slow{to{transform:rotate(360deg)}}

/* form */
#form .stage{flex:1;width:100%;display:flex;flex-direction:column;justify-content:center;gap:30px}
.field{position:relative;border-bottom:1px solid var(--line);padding:22px 0 10px;transition:border-color .3s}
.field:focus-within{border-color:var(--gold)}
.field label{position:absolute;left:0;top:30px;font-size:22px;color:var(--ink-mute);transition:all .25s;pointer-events:none}
.field input{width:100%;background:none;border:0;outline:0;font-size:36px;font-family:var(--serif);font-weight:500;letter-spacing:.01em;padding:0}
.field input:focus+label,.field input:not(:placeholder-shown)+label{top:0;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.field.ph input{padding-left:80px;letter-spacing:.06em}
.field.ph .cc{position:absolute;left:0;bottom:12px;font-family:var(--serif);font-size:36px;color:var(--ink-soft)}
.field.ph label{left:80px}
.field.ph input:not(:placeholder-shown)+label{left:0}
.field input:focus+label{left:0}
.field.bad{border-color:#E08A7A}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:13px;line-height:1.5;color:var(--ink-soft);cursor:pointer}
.consent input{appearance:none;flex:none;width:18px;height:18px;margin:1px 0 0;border:1px solid var(--gold);border-radius:4px;display:grid;place-items:center;cursor:pointer}
.consent input:checked{background:var(--gold-grad)}
.consent input:checked::after{content:"";width:8px;height:4px;border:solid #3A0A12;border-width:0 0 1.6px 1.6px;transform:rotate(-45deg) translate(1px,-1px)}

/* wheel */
#wheel{gap:0}
#wheel .top{display:flex;flex-direction:column;align-items:center;gap:14px}
.hint{display:none}
.wheel-wrap{position:relative;flex:1;margin:0 -28px;width:calc(100% + 56px);display:flex;align-items:center;justify-content:center;min-height:0;container-type:inline-size}
.dial{position:relative;flex:none;aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none}
/* A · whole wheel, as wide as the phone */
#wheel[data-lay=a] .dial{width:min(94cqw,62dvh)}
/* B · close-up: bigger than the phone, the sides run off the edges */
#wheel[data-lay=b] .dial{width:128cqw}
/* C · rising: a huge wheel rising from the bottom, its centre just on screen */
#wheel[data-lay=c] .wheel-wrap{display:block}
#wheel[data-lay=c] .dial{position:absolute;width:170cqw;left:-35cqw;bottom:calc(-85cqw + 96px)}
#wheel[data-lay=c] .foot{display:none}
/* D · headline above a whole wheel */
#wheel .lay-head{display:none;text-align:center;margin-top:18px}
#wheel[data-lay=d] .lay-head{display:block}
#wheel[data-lay=d] .dial{width:min(90cqw,50dvh)}
#spinBtn{display:none;position:absolute;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);width:calc(100% - 96px);max-width:260px;z-index:3}
#wheel[data-lay=c] #spinBtn{display:block}
#wheel.zoom #spinBtn{opacity:0;pointer-events:none;transition:opacity .4s}
.dial svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dial svg.pointer{position:absolute;inset:auto;height:auto;left:50%;top:-5%;width:10.5%;transform:translateX(-50%);transform-origin:50% 22%;z-index:3;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35));transition:transform .08s}
.dial svg.pointer.flick{transform:translateX(-50%) rotate(-14deg)}
.hub{position:absolute;left:50%;top:50%;width:21%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;z-index:2;
  background:radial-gradient(circle at 40% 32%,#7A2331,#4A0F19 70%,#33070F 100%);box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 0 0 1.5px #D9B060,inset 0 0 0 4px rgba(61,11,19,.9),inset 0 0 0 5px rgba(217,176,96,.45);
  display:grid;place-items:center;transition:transform .25s}
.hub:active{transform:translate(-50%,-50%) scale(.95)}
.hub svg{position:static;width:58%;height:58%}
.hub.idle svg{animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(1)}50%{transform:scale(.84)}}
.dial .rimlight{position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:1;
  background:conic-gradient(from 300deg,transparent 0deg,rgba(255,240,200,.16) 30deg,transparent 70deg,transparent 180deg,rgba(255,240,200,.08) 210deg,transparent 240deg);
  -webkit-mask:radial-gradient(circle,transparent 61%,#000 62%,#000 100%);mask:radial-gradient(circle,transparent 61%,#000 62%,#000 100%)}
/* the win: the camera moves in on the wheel, the wheel stays, and the winning piece lifts out of it */
.dial{transition:transform 1.5s cubic-bezier(.65,0,.25,1)}
#rotor > *{transition:opacity .9s}
#wheel.zoom #rotor > .fade{opacity:.42!important}
#wheel.zoom .dial svg.pointer,#wheel.zoom .rimlight,#wheel.zoom .foot,#wheel.zoom .hint,#wheel.zoom .lay-head{opacity:0!important;transition:opacity .5s}
#wheel.zoom .hub{opacity:.5;transition:opacity .9s}
.outline{fill:none;stroke:url(#gg);stroke-width:1.5;stroke-dasharray:1;stroke-dashoffset:1}
#wheel.zoom .outline{stroke-dashoffset:0;transition:stroke-dashoffset 1.8s cubic-bezier(.6,0,.2,1) .9s}
#scrim{position:absolute;left:0;right:0;bottom:0;height:42%;z-index:3;pointer-events:none;opacity:0;transition:opacity 1s .6s;
  background:linear-gradient(180deg,rgba(61,11,19,0),rgba(61,11,19,.88) 45%,#3D0B13)}
#wheel.zoom #scrim{opacity:1}

/* the message, written into the segment */
#msg{position:absolute;inset:0;z-index:4;pointer-events:none}
#msg.on .act{pointer-events:auto}
#msg .in,#msg .act{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;text-align:center}
#msg .act{width:calc(100% - 56px);max-width:320px;top:auto!important;bottom:calc(26px + env(safe-area-inset-bottom))}
#msg .r{opacity:0;transform:translateY(8px)}
#msg.on .r{opacity:1;transform:none;transition:opacity .8s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
#msg.on .r1{transition-delay:1.5s}#msg.on .r2{transition-delay:2.05s;transition-duration:.55s}#msg.on .r3{transition-delay:2.15s}#msg.on .r4{transition-delay:2.4s}#msg.on .r5{transition-delay:2.65s}#msg.on .r6{transition-delay:2.9s}
#msg .spark{width:16px;height:16px;margin:8px 0 10px}
/* V1.8: after Done the light keeps moving and a next step appears */
#msg.on .spark{animation:twinkle2 2.8s ease-in-out 3.2s infinite}
@keyframes twinkle2{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(1.35) rotate(18deg);opacity:.7}}
#msg .gone{opacity:0!important;transform:translateY(8px)!important;pointer-events:none;transition:opacity .5s,transform .5s!important}
#welcome .kicker,#form .kicker{font-size:12px;letter-spacing:.26em;color:var(--gold)}
#redeem{overflow-y:auto}
#redeem .kicker{font-size:14px;letter-spacing:.26em;font-weight:500;color:var(--gold)}
#redeem .ghost{font-size:15px;font-weight:500;color:var(--ink)}
#redeem .rd-stage{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
#redeem .rd-how{font-size:22px;line-height:1.4;font-weight:500;color:var(--ink);text-align:center;max-width:320px;margin:6px 0 0}
#redeem .rd-prize{font-family:var(--serif);font-weight:500;font-size:62px;font-weight:600;line-height:1;text-align:center;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
#redeem .rd-sub{font-size:16px;color:var(--ink);text-align:center;margin:0}
#redeem .code{margin:4px 0 0}
#redeem ol{list-style:none;counter-reset:s;margin:6px 0 0;padding:0;width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px}
#redeem li{counter-increment:s;display:flex;gap:14px;align-items:flex-start;font-size:16px;line-height:1.45;color:var(--ink)}
#redeem li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font-family:var(--serif);font-size:16px;font-weight:600;color:var(--gold-hi)}
#redeem .rd-fine{font-size:18px;line-height:1.4;font-weight:400;color:rgba(246,233,207,.82);text-align:center;max-width:320px;margin:-6px 0 0}
#redeem .rd-acts{margin-top:auto;width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:8px}
.btn.line{background:none;border:1px solid var(--gold);color:var(--gold-hi);box-shadow:none;position:relative;overflow:hidden}
.btn.line::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,240,200,.35),transparent);animation:btnsheen 3.4s ease-in-out 1s infinite}
#app.redeeming #msg{opacity:0;pointer-events:none;transition:opacity .4s}
#app.redeeming #msg .act{pointer-events:none}
#after{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;opacity:0;transform:translateY(10px);transition:opacity .8s ease .2s,transform .9s cubic-bezier(.2,.7,.2,1) .2s}
#after.show{opacity:1;transform:none}
#after .btn{background:none;border:1px solid var(--gold);color:var(--gold-hi);box-shadow:none;position:relative;overflow:hidden}
#after .btn::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,240,200,.35),transparent);animation:btnsheen 3.4s ease-in-out 1s infinite}
@keyframes btnsheen{0%{left:-60%}55%,100%{left:130%}}
#msg .detail{font-size:16px;line-height:1.45;margin:0;color:var(--ink)}
#msg .kicker{font-size:13px;letter-spacing:.22em;color:var(--ink)}
.prize{font-family:var(--serif);font-weight:500;font-size:58px;line-height:.98;margin:10px 0 0;
  background:linear-gradient(100deg,#F8E2A6 0%,#D9B060 34%,#FFF8E4 50%,#F8E2A6 62%,#D9B060 100%);background-size:250% 100%;background-position:100% 0;
  -webkit-background-clip:text;background-clip:text;color:transparent}
#msg.on .prize{animation:sweep 2.6s ease 1.9s both}
@keyframes sweep{from{background-position:100% 0}to{background-position:0 0}}
.prize small{display:block;font-family:var(--sans);font-weight:400;font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-top:10px;font-size:16px;font-weight:500;color:var(--gold);-webkit-text-fill-color:var(--gold)}
.detail{font-size:14px;line-height:1.55;color:var(--ink-soft);margin:0 0 16px}
.code{display:inline-flex;flex-direction:column;gap:4px;border:1px dashed var(--line);border-radius:10px;padding:10px 22px;margin-bottom:18px}
.code b{font-family:var(--serif);font-weight:600;font-size:31px;letter-spacing:.18em;color:var(--ink)}
.code span{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-hi);font-weight:400}
#msg .btn{height:48px}
/* V2.2: the code looks like a coupon — a gold ticket with notched sides, a stub and a perforation */
.tkw{filter:drop-shadow(0 12px 24px rgba(0,0,0,.38));margin:0 auto}
.ticket{position:relative;display:flex;align-items:stretch;width:310px;height:96px;color:#59131D;background:linear-gradient(180deg,#FFFBF1,#F4E7CC);border-radius:10px;overflow:hidden;
  -webkit-mask:radial-gradient(circle at 0 50%,transparent 11px,#000 11.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 11px,#000 11.5px) right/51% 100% no-repeat;
  mask:radial-gradient(circle at 0 50%,transparent 11px,#000 11.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 11px,#000 11.5px) right/51% 100% no-repeat}
.ticket::after{content:"";position:absolute;top:0;bottom:0;width:38%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);animation:btnsheen 4.2s ease-in-out 2.6s infinite}
.tk-stub{flex:none;width:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding-left:6px;background:var(--gold-grad)}
/* V2.3: a test code says TEST in the stub, so the code itself never moves */
.tk-tt{display:none;font-style:normal;font-size:9.5px;line-height:1;letter-spacing:.16em;font-weight:600;text-transform:uppercase;color:#3A0A12}
.ticket.test .tk-tt{display:block}
.tk-stub svg{width:26px;height:26px}
.tk-perf{flex:none;width:0;border-left:2px dashed rgba(169,122,44,.75)}
.tk-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding-right:14px}
.tk-main span{font-size:11px;letter-spacing:.16em;white-space:nowrap;text-transform:uppercase;font-weight:500;color:#8A5A1E}
.tk-main b{font-family:var(--serif);font-weight:700;font-size:42px;line-height:1;letter-spacing:.08em;color:#59131D;white-space:nowrap}
.tk-main .tt{background:rgba(58,10,18,.14);color:#3A0A12;font-size:.38em}
#msg .act{gap:16px}
#msg .who{position:absolute;left:0;right:0;text-align:center;font-size:15px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:var(--gold-hi)}
#msg .in .detail{font-size:17px;line-height:1.35;font-weight:400;color:var(--ink);margin:0;text-wrap:balance}
#msg .prize,#msg .prize small{white-space:nowrap}
#msg.lose .prize{font-size:44px!important}

/* V2.4 · collab: a partner's logo sits beside Jewelchic's on every screen.
   One logo file drives it all. It is drawn as a shape filled with the page's own gold
   (or wine on the coupon), so any partner fits the palette unchanged. */
.duo{display:none;align-items:center;justify-content:center}
#app.collab .duo{display:flex}
.pl{display:none;flex:none;background:var(--gold-grad);-webkit-mask:var(--pl) center/contain no-repeat;mask:var(--pl) center/contain no-repeat}
#app.collab .pl{display:block}
.dx{font-family:var(--serif);font-weight:500;color:var(--gold);line-height:1}
.lock{display:flex;align-items:center;justify-content:center}
.lock.v{flex-direction:column;gap:14px}
.lock.v .duo{flex-direction:column;gap:12px}
.lock.v .dx{font-size:26px}
.lock.v .pl{width:176px;height:54px}
#app.collab .lock.v .mark{width:min(52%,210px)}
#app.collab .halo{width:214px;height:214px;margin:0}
.lock.h{gap:14px}
.lock.h .duo{gap:14px}
.lock.h .dx{font-size:22px}
.lock.h .pl{width:100px;height:28px}
#app.collab .lock.h .mark.sm{width:118px}
#redeem .rd-collab{display:none;flex-direction:column;align-items:center;gap:8px;margin:2px 0 0}
#app.collab #redeem .rd-collab{display:flex}
#redeem .rd-collab span{font-size:12px;letter-spacing:.26em;text-transform:uppercase;font-weight:500;color:var(--gold)}
#redeem .rd-collab .pl{width:140px;height:38px}
#app.collab .tk-stub svg{display:none}
.tk-pl{width:66px;height:38px;transform:rotate(-90deg);background:#3A0A12!important}
#app.collab .tk-stub{gap:20px}
#app.collab .ticket.test .tk-pl{margin-top:-6px}
/* the partner's logo sits on the same ivory paper as the coupon, printed in wine */
.plate{display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:linear-gradient(180deg,#FFFBF1,#F4E7CC);
  box-shadow:0 8px 20px rgba(0,0,0,.32),inset 0 0 0 1px rgba(169,122,44,.35)}
.plate .pl{background:#59131D}
.lock.v .plate{padding:12px 22px}
.lock.h .plate{padding:6px 12px;border-radius:9px}
#redeem .rd-collab .plate{padding:10px 18px}
.jw{display:contents}
/* Jewelchic's own logo as a shape too, for lockups that print both logos in one colour */
.jl{display:none;flex:none;background:var(--gold-grad);-webkit-mask:var(--jl) center/contain no-repeat;mask:var(--jl) center/contain no-repeat}
.ring{font-family:var(--sans);font-weight:500;letter-spacing:.22em;fill:#ECC984}

/* text wordmark when the setup has no logo */
.wm{font-family:var(--serif);font-weight:600;font-size:40px;letter-spacing:.02em;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
.wm.sm{font-size:24px}
[hidden]{display:none!important}
.ferr{min-height:18px;font-size:13px;color:#F0A08F;text-align:center}
#stateSub{margin-top:-6px}
/* V2.6 — everything fits its container on every phone (Chirag, 26 Oct 2026) */
.h1{font-size:clamp(30px,11vw,44px)}
#fHead{font-size:clamp(28px,10vw,40px)!important}
.sub,#redeem .rd-fine{overflow-wrap:anywhere}
.field input,.field.ph .cc{font-size:clamp(24px,9vw,36px)}
.field.ph input{padding-left:clamp(60px,20vw,80px)}
.field.ph label{left:clamp(60px,20vw,80px)}
.halo{width:min(250px,64vw,30dvh);height:min(250px,64vw,30dvh)}
#welcome .stage{gap:clamp(10px,2.6dvh,22px);min-height:0}
.tkw{max-width:100%;display:flex;justify-content:center}
.ticket{width:min(310px,100%);height:auto;min-height:88px}
.tk-main{min-width:0;overflow:hidden;padding:10px 12px 10px 8px}
.tk-main span{white-space:normal;text-align:center;line-height:1.3;font-size:10px;letter-spacing:.12em;max-width:100%;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;padding:0 2px}
.tk-main b{max-width:100%;overflow:hidden}

<script>
"use strict";
(function () {
/* ═══ WheelDeal · the Jewel look · V2.4 New Jersey ═══════════════════
   A fresh template beside Gold, Neon and Pop (Chirag, 24 Oct 2026, from
   "03 - Jewelchic WheelDeal - mockup.html"). wheel/index.html sends a
   wheel whose look is "jewel" here, with the same address query.

   ?g=<wheel>   welcome → name and mobile → swipe the wheel → the winning
                piece lifts out of the wheel and the prize is written on it.
                The database picks the prize (wheel_spin); the wheel is
                steered onto it. One spin per mobile.
   ?preview=1   MarTech's setup preview: no database, it draws what
                MarTech posts and spins by the odds.
   &test=1      a test spin (marked test, uses no stock). */
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";

const SB_URL = "https://qsxldzqdjdplffxqdokd.supabase.co", SB_KEY = "sb_publishable_6ng_3jnvQbJUZifYTxmRrw_0yhCZuY9";
const qs = new URLSearchParams(location.search), SLUG = (qs.get("g") || "").toLowerCase().replace(/[^a-z0-9-]/g, ""), PREVIEW = qs.get("preview") === "1";
const KEEP = "wheeldeal:" + SLUG;
const keep = (v) => { try { localStorage.setItem(KEEP, JSON.stringify(v)); } catch (e) {} };
const kept = () => { try { return JSON.parse(localStorage.getItem(KEEP) || "null"); } catch (e) { return null; } };
function rpc(fn, args) {
  return fetch(`${SB_URL}/rest/v1/rpc/${fn}`, { method: "POST",
    headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, "content-type": "application/json" }, body: JSON.stringify(args) })
    .then(async (r) => { const j = await r.json().catch(() => null); if (!r.ok) throw new Error((j && (j.message || j.hint)) || ("HTTP " + r.status)); return j; });
}

/* ── the wheel ── */
let P = [], N = 0, SEG = 45, cfg = {};
let segs = [], labels = [], glow = null;
const rotor = $("rotor");
const outline = el("path", { d: "", class: "outline", pathLength: 1, "vector-effect": "non-scaling-stroke" });
function drawWheel() {
  rotor.innerHTML = ""; segs = []; labels = []; N = P.length; SEG = 360 / N;
  el("circle", { r: 196, fill: "none", stroke: "url(#gg)", "stroke-width": 1.2, opacity: .55 }, rotor);
  el("circle", { r: 186, fill: "#3D0B13" }, rotor);
  el("circle", { r: 186, fill: "none", stroke: "url(#gg)", "stroke-width": 2.2 }, rotor);
  for (let i = 0; i < N; i++) {
    const [x0, y0] = pt(176, i * SEG), [x1, y1] = pt(176, i * SEG + SEG);
    segs.push(el("path", { d: `M0 0L${x0} ${y0}A176 176 0 0 1 ${x1} ${y1}Z`, fill: i % 2 ? "var(--wine-seg-b)" : "var(--wine-seg-a)", style: "transition:fill .6s,opacity .6s" }, rotor));
  }
  glow = el("path", { d: "", fill: "url(#gg)", opacity: 0, style: "transition:opacity .7s" }, rotor);
  for (let i = 0; i < N; i++) {
    const [x, y] = pt(176, i * SEG);
    el("line", { x1: 0, y1: 0, x2: x, y2: y, stroke: "url(#gg)", "stroke-width": .7, opacity: .7 }, rotor);
    const [px, py] = pt(186, i * SEG); el("circle", { cx: px, cy: py, r: 3.6, fill: "url(#gg)" }, rotor);
    const [qx, qy] = pt(186, i * SEG + SEG / 2); el("circle", { cx: qx, cy: qy, r: 1.4, fill: "#E3BF74", opacity: .8 }, rotor);
  }
  el("circle", { r: 176, fill: "none", stroke: "url(#gg)", "stroke-width": .6, opacity: .8 }, rotor);
  el("circle", { r: 58, fill: "none", stroke: "url(#gg)", "stroke-width": .6, opacity: .7 }, rotor);
  ring(rotor, 71, 8.2, .8);
  const fit = N > 10 ? .72 : N > 8 ? .85 : 1;
  P.forEach((p, i) => {
    const g = el("g", { transform: `rotate(${i * SEG + SEG / 2})`, style: "transition:opacity .6s" }, rotor);
    const big = el("text", { x: 0, y: -128, "text-anchor": "middle", fill: "#F6E9CF", "font-family": "Cormorant Garamond, Georgia, serif", "font-weight": 600, "font-size": (p.t.length > 4 ? 25 : 32) * fit }, g);
    big.textContent = p.t;
    big.setAttribute("y", -130);
    const sm = el("text", { x: 0, y: -103, "text-anchor": "middle", fill: "#ECC984", "font-family": "Jost, sans-serif", "font-weight": 500, "font-size": 12.5 * fit, "letter-spacing": 1.1 * fit }, g);
    sm.textContent = (p.s || "").toUpperCase();
    labels.push(g);
  });
  for (const c of rotor.children) c.classList.add("fade");
  fitLabels();
  /* the welcome halo: the same wheel in outline, turning slowly */
  const h = $("haloSvg"); h.innerHTML = "";
  el("circle", { r: 122, fill: "none", stroke: "url(#gg)", "stroke-width": .8, opacity: .55 }, h);
  el("circle", { r: 112, fill: "none", stroke: "url(#gg)", "stroke-width": .5, opacity: .35 }, h);
  for (let i = 0; i < N; i++) {
    const [x, y] = pt(112, i * SEG); el("line", { x1: 0, y1: 0, x2: x, y2: y, stroke: "url(#gg)", "stroke-width": .4, opacity: .3 }, h);
    const [px, py] = pt(122, i * SEG); el("circle", { cx: px, cy: py, r: 2.4, fill: "url(#gg)" }, h);
  }
  el("use", { href: "#star", x: -22, y: -22, width: 44, height: 44, fill: "url(#gg)" }, h);
  ring(h, 98, 8.6, .9);
  rot = 0; lastTick = 0; rotor.setAttribute("transform", "rotate(0)");
}

/* V2.4: "JEWELCHIC × PARTNER" engraved round a circle, repeated to close the ring */
let ringN = 0;
function ring(svg, r, size, op) {
  if (!String(cfg.partner_logo_url || "").trim() || !cfg.partner_name) return;
  const id = "rg" + (++ringN), L = 2 * Math.PI * r;
  el("path", { id, d: `M0 ${-r}A${r} ${r} 0 1 1 0 ${r}A${r} ${r} 0 1 1 0 ${-r}`, fill: "none" }, svg);
  const one = ((cfg.brand_line || "Jewelchic") + " × " + cfg.partner_name + "  ✦  ").toUpperCase(), per = one.length * size * .86;
  const t = el("text", { class: "ring", "font-size": size, opacity: op }, svg);
  const tp = el("textPath", { href: "#" + id, textLength: (L - 2).toFixed(1), lengthAdjust: "spacing" }, t);
  tp.textContent = one.repeat(Math.max(1, Math.round(L / per)));
}

/* a label never runs past the edges of its slice: shrink it to fit */
function fitLabels() {
  labels.forEach((g) => [...g.querySelectorAll("text")].forEach((tx) => {
    const y = Math.abs(+tx.getAttribute("y")), room = 2 * (y - 6) * Math.sin(Math.PI / N) * .9;
    let w = 0; try { w = tx.getComputedTextLength(); } catch (e) {}
    if (!tx.dataset.fs) tx.dataset.fs = tx.getAttribute("font-size");
    const fs = +tx.dataset.fs; tx.setAttribute("font-size", w > room && w > 0 ? (fs * room / w).toFixed(2) : fs);
  }));
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitLabels());
/* the look: the setup's words, logo and framing */
const FRAME = { whole: "a", close: "b", hero: "c" };
function applyGame(g) {
  const c = (g && g.config) || {};
  cfg = c; soundOn = c.sound !== false;
  P = ((g && g.prizes) || []).map((p) => ({ key: p.key, t: p.top || "", s: p.sub || "", win: p.win !== false, w: Math.max(0, +p.weight || 0) || 1 }));
  if (P.length < 2) P = [{ t: "Add", s: "prizes", win: true, w: 1 }, { t: "in", s: "MarTech", win: true, w: 1 }];
  /* the logo, or the brand line set in the serif when there is none */
  document.querySelectorAll("[data-img=mark]").forEach((img) => {
    const tx = img.nextElementSibling && img.nextElementSibling.classList.contains("wm") ? img.nextElementSibling : null;
    if (c.logo_url) { img.src = c.logo_url; img.hidden = false; if (tx) tx.hidden = true; }
    else { img.hidden = true; if (tx) { tx.hidden = false; tx.textContent = c.brand_line || ""; } }
  });
  /* V2.4: the partner (collab wheels only) */
  const PL = String(c.partner_logo_url || "").trim();
  $("app").classList.toggle("collab", !!PL);
  $("app").style.setProperty("--pl", PL ? 'url("' + PL.replace(/"/g, "%22") + '")' : "none");
  $("app").style.setProperty("--jl", c.logo_url ? 'url("' + String(c.logo_url).replace(/"/g, "%22") + '")' : "none");
  const foot = document.querySelector("[data-img=badge]");
  if (c.footer_url) { foot.src = c.footer_url; foot.hidden = false; } else foot.hidden = true;
  $("head").innerHTML = esc(c.headline || "Spin for a") + " <i>" + esc(c.headline_em || "little sparkle") + "</i>";
  $("consentTxt").textContent = c.consent || "I agree to be contacted about my prize.";
  /* V1.9: the words that make someone want to go on (defaults are the recommended set) */
  $("wKick").textContent = c.welcome_kicker || ""; $("wKick").hidden = !$("wKick").textContent;
  $("wSub").textContent = c.welcome_sub == null ? "" : c.welcome_sub;
  $("wSub").hidden = !$("wSub").textContent;
  $("begin").textContent = c.begin_label || "Try my luck";
  $("fHead").innerHTML = esc(c.form_head || "Unlock your") + " <i>" + esc(c.form_head_em || "spin") + "</i>";
  $("fSub").textContent = c.form_sub || ""; $("fSub").hidden = !$("fSub").textContent;
  $("go").textContent = c.unlock_label || "Unlock my spin";
  $("rCodeNote").textContent = c.fine || "Show this at the counter";
  const lay = c.preset === "" ? "x" : (FRAME[c.preset] || "b");
  $("wheel").dataset.lay = lay;
  $("dial").style.width = lay === "x" ? `min(${Math.round(94 * (+c.zoom || 100) / 100)}cqw, 140dvh)` : "";
  $("dial").style.marginTop = lay === "x" ? (+c.pos || 0) + "%" : "";

  document.title = [c.headline, c.headline_em].filter(Boolean).join(" ") + (c.brand_line ? " · " + c.brand_line + (PL && c.partner_name ? " × " + c.partner_name : "") : "") || "Spin the wheel";
  reset(); drawWheel();
  document.body.classList.add("ready");
}

/* ── sound: glass ticks and a bell chord, made in the browser ── */
let soundOn = true, ac = null;
const ctx = () => (ac = ac || new (window.AudioContext || window.webkitAudioContext)());
function tone(f, t0, dur, vol, type) {
  const a = ctx(), o = a.createOscillator(), g = a.createGain();
  o.type = type || "sine"; o.frequency.value = f; g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + .006); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);

    /* V2.5 (26 Oct 2026): a test link opens in every status; visitors only while Live or Testing */
    if (qs.get("test") !== "1") {
      if (g.status === "draft") return showState("This wheel opens soon.");
      if (g.status === "closed" || g.status === "archived") return showState("This wheel has closed.", "Thank you for joining in.");
    }
    /* V2.1: a test (Testing status, or MarTech's "Open a test spin" link) always starts fresh */
    const TESTLINK = qs.get("test") === "1";
    if (TESTLINK) { try { localStorage.removeItem(KEEP); } catch (e) {} }
    live = true; TESTING = g.status === "testing" || TESTLINK; $("testTag").hidden = !TESTING; $("rdAgain").hidden = !TESTING;
    const k = TESTING ? null : kept(); if (k && k.code !== undefined && k.index !== undefined) replay(k);
  }).catch(() => showState("Couldn't load the wheel.", "Check your connection and try again."));
}
addEventListener("resize", () => { if (!spent) size(); fitCode($("rCodeTxt")); fitCode($("rdCode")); fitLine($("rdPrize"), 62, 26); fitLine($("rFor"), 15, 10); });
boot();
})();
</script>
<script>
/* V2.3: glitter rain on a win (Chirag chose option C from mockup 06). Fires on wins only. */
(function () {
const FX = "C";
const app = document.getElementById("app"), wheel = document.getElementById("wheel"), msg = document.getElementById("msg");
const cv = document.createElement("canvas");
cv.style.cssText = "position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6";
app.appendChild(cv);
const c = cv.getContext("2d"), DPR = Math.min(2, window.devicePixelRatio || 1); let W = 0, H = 0;
function size() { const r = app.getBoundingClientRect(); W = r.width; H = r.height; cv.width = W * DPR; cv.height = H * DPR; c.setTransform(DPR, 0, 0, DPR, 0, 0); }
size(); addEventListener("resize", size);
const rnd = (a, b) => a + Math.random() * (b - a), pick = (a) => a[Math.random() * a.length | 0];
const GOLD = ["#FFF6DA", "#F8E2A6", "#EED39A", "#E3BF74", "#FFFFFF", "#D9B060"];
let parts = [], timers = [];
const later = (ms, f) => timers.push(setTimeout(f, ms));
function clear() { timers.forEach(clearTimeout); timers = []; parts = []; }
const add = (p) => parts.push(Object.assign({ x: 0, y: 0, vx: 0, vy: 0, g: 0, drag: 1, s: 2, rot: rnd(0, 6.3), vr: rnd(-.08, .08), life: 0, max: 80, k: "star", col: pick(GOLD), tw: rnd(0, 6) }, p));

/* where things are, in the page's own pixels */
const A = () => app.getBoundingClientRect();
function piece() { const K = corners(); if (!K) return null;
  const x = Math.min(K.c1.x, K.c2.x), w = Math.abs(K.c2.x - K.c1.x), y = Math.min(K.mid.y, K.c1.y, K.c2.y), h = K.apex.y - y;
  return { x, y, w, h, cx: x + w / 2, cy: y + h * .3 }; }
function along(f) { const o = document.querySelector("#lift .outline"); if (!o) return { x: 0, y: 0 };
  const L = o.getTotalLength(), p = o.getPointAtLength(L * f).matrixTransform(o.getScreenCTM()), a = A(); return { x: p.x - a.left, y: p.y - a.top }; }
function corners() { const o = document.querySelector("#lift .outline"); if (!o) return null; const L = o.getTotalLength(), e = 176 / L;
  return { c1: along(e), mid: along(.5), c2: along(1 - e), apex: along(0) }; }
function ticket() { const t = document.querySelector("#rCode .ticket"); if (!t) return null; const r = t.getBoundingClientRect(), a = A();
  return { x: r.left - a.left, y: r.top - a.top, w: r.width, h: r.height, cx: r.left - a.left + r.width / 2, cy: r.top - a.top + r.height / 2 }; }

/* drawing */
function star(x, y, s, rot) { c.save(); c.translate(x, y); c.rotate(rot); c.beginPath(); c.moveTo(0, -s * 2.4); c.quadraticCurveTo(0, 0, s * 2.4, 0);
  c.quadraticCurveTo(0, 0, 0, s * 2.4); c.quadraticCurveTo(0, 0, -s * 2.4, 0); c.quadraticCurveTo(0, 0, 0, -s * 2.4); c.fill(); c.restore(); }
function ray(L, w) { c.beginPath(); c.moveTo(0, -w); c.lineTo(L, 0); c.lineTo(0, w); c.lineTo(-L, 0); c.closePath(); c.fill(); }
function glint(x, y, s, rot, a) {
  c.save(); c.translate(x, y); c.globalCompositeOperation = "lighter";
  const g = c.createRadialGradient(0, 0, 0, 0, 0, s); g.addColorStop(0, `rgba(255,250,232,${a})`); g.addColorStop(.3, `rgba(248,226,166,${a * .45})`); g.addColorStop(1, "rgba(248,226,166,0)");
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, s, 0, 7); c.fill();
  c.rotate(rot); c.fillStyle = `rgba(255,248,226,${a})`; ray(s * 2.4, s * .06); c.rotate(Math.PI / 2); ray(s * 2.4, s * .06);
  c.rotate(Math.PI / 4); c.globalAlpha = .55; ray(s * 1.1, s * .045); c.rotate(Math.PI / 2); ray(s * 1.1, s * .045);
  c.restore(); }
(function loop() {
  c.clearRect(0, 0, W, H);
  parts = parts.filter((p) => p.life < p.max && p.y < H + 40);
  for (const p of parts) {
    p.life++; p.vx *= p.drag; p.vy = p.vy * p.drag + p.g; p.x += p.vx + (p.sway ? Math.sin(p.life * .06 + p.tw) * p.sway : 0); p.y += p.vy; p.rot += p.vr; p.tw += .18;
    const fade = Math.max(0, Math.min(1, p.life / 6, (p.max - p.life) / (p.max * .45)));
    if (p.k === "glint") { const q = p.life / p.max, s = p.s * Math.sin(Math.PI * q); glint(p.x, p.y, s, p.rot, Math.min(1, 1.6 * Math.sin(Math.PI * q))); continue; }
    if (p.k === "ring") { const q = p.life / p.max; c.save(); c.globalCompositeOperation = "lighter"; c.strokeStyle = `rgba(248,226,166,${.5 * (1 - q)})`; c.lineWidth = 1 + 2.5 * (1 - q);
      c.beginPath(); c.arc(p.x, p.y, p.s * (.15 + q), 0, 7); c.stroke(); c.restore(); continue; }
    c.globalAlpha = fade * (p.k === "flake" ? .55 + .45 * Math.abs(Math.cos(p.rot * 2)) : .75 + .25 * Math.sin(p.tw)); c.fillStyle = p.col;
    if (p.k === "flake") { c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.fillRect(-p.s, -p.s * .5 * Math.abs(Math.cos(p.rot * 1.7)) - .3, p.s * 2, p.s * Math.abs(Math.cos(p.rot * 1.7)) + .6); c.restore(); }
    else if (p.k === "dot") { c.beginPath(); c.arc(p.x, p.y, p.s, 0, 7); c.fill(); }
    else star(p.x, p.y, p.s, p.rot);
  }
  c.globalAlpha = 1; requestAnimationFrame(loop);
})();

/* ── the effect ── */
const FXS = {
  /* C · Glitter rain: fine gold foil drifts down over the piece; a short sprinkle falls over the coupon */
  C: { piece() { const P = piece(); if (!P) return; const t0 = performance.now();
         (function rain(t) { const q = (t - t0) / 2600; if (q > 1) return;
           for (let n = 0; n < 5; n++) add({ k: "flake", x: Math.random() < .7 ? rnd(P.x, P.x + P.w) : rnd(0, W), y: rnd(-30, -4), vx: rnd(-.3, .3), vy: rnd(1.2, 2.8), sway: rnd(.3, .9), s: rnd(1.4, 3.4), vr: rnd(-.12, .12), max: 520 });
           requestAnimationFrame(rain); })(t0);
         const K = corners(); if (K) add({ k: "glint", x: K.mid.x, y: K.mid.y, s: 38, max: 50 }); },
       coupon() { const T = ticket(); if (!T) return;
         for (let n = 0; n < 70; n++) add({ k: "flake", x: rnd(T.x, T.x + T.w), y: T.y - rnd(10, 70), vx: rnd(-.3, .3), vy: rnd(.8, 1.8), sway: rnd(.2, .6), s: rnd(1.2, 2.8), vr: rnd(-.12, .12), max: rnd(60, 100) }); } }
};

/* when it fires: the piece has settled about 1.5 s after the camera moves in; the coupon arrives at 2.65 s */
let was = false;
new MutationObserver(() => {
  const on = wheel.classList.contains("zoom");
  if (on && !was) { was = true; if (msg.classList.contains("lose")) return; const fx = FXS[FX]; if (!fx) return;
    later(1550, fx.piece); later(2700, fx.coupon); }
  if (!on && was) { was = false; clear(); }
}).observe(wheel, { attributes: true, attributeFilter: ["class"] });
/* the glitter belongs to the win screen: it stops when Redeem opens */
new MutationObserver(() => { if (app.classList.contains("redeeming")) clear(); }).observe(app, { attributes: true, attributeFilter: ["class"] });
})();
</script>
