<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spin the wheel</title>
<meta name="cc-tool-version" content="V1.1 New Jersey">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap">
<style>
:root{
  --red:#A10E06; --red-hi:#B8170C; --red-deep:#7E0A04; --pink:#E40045;
  --paper:#FFFFFF; --blush:#F7E9E4; --cocoa:#5A2A20; --cocoa-2:#803912;
  --ink:#FFFFFF; --ink-soft:rgba(255,255,255,.78); --ink-mute:rgba(255,255,255,.5);
  --line:rgba(255,255,255,.4);
  --serif:"Cinzel",Georgia,serif; --sans:"Quicksand",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--red-deep);color:var(--ink);font-family:var(--sans);font-weight:600;overflow:hidden}
button,input{font:inherit;color:inherit}
#app{position:relative;max-width:440px;height:100dvh;margin:0 auto;overflow:hidden;
  background:radial-gradient(110% 70% at 50% 40%,#B5150B 0,var(--red) 45%,var(--red-deep) 100%)}
/* the brochure's pink corner */
#app::after{content:"";position:absolute;right:0;bottom:0;width:38%;height:24%;pointer-events:none;z-index:1;
  background:var(--pink);clip-path:polygon(100% 0,100% 100%,0 100%)}
body:not(.ready) .scr{visibility:hidden}
#testTag{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:9;font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;
  color:var(--red);background:#fff;border-radius:999px;padding:5px 10px}
.tt{font-family:var(--sans);font-size:.42em;letter-spacing:.14em;vertical-align:middle;margin-left:.5em;padding:3px 7px;border-radius:6px;background:rgba(161,14,6,.12);color:var(--red)}
#dust{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}

/* ── screens ── */
.scr{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;
  padding:calc(28px + env(safe-area-inset-top)) 28px calc(26px + env(safe-area-inset-bottom));
  opacity:0;pointer-events:none;transform:translateY(14px);transition:opacity .7s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.scr.on{opacity:1;pointer-events:auto;transform:none}
.mark{width:min(36%,150px);height:auto;display:block}
.mark.sm{width:74px}
.kicker{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
.h1{font-family:var(--serif);font-weight:700;font-size:36px;line-height:1.08;margin:0;text-align:center;letter-spacing:.01em;color:#fff}
.h1 i{font-style:normal;color:#FFD5DC}
.sub{font-size:16px;line-height:1.5;color:var(--ink-soft);text-align:center;max-width:290px;margin:0}
.btn{appearance:none;border:0;cursor:pointer;width:100%;max-width:320px;height:56px;border-radius:999px;position:relative;z-index:2;
  background:#fff;color:var(--red);font-weight:700;font-size:13px;letter-spacing:.22em;text-transform:uppercase;
  box-shadow:0 10px 26px rgba(60,0,0,.32);transition:transform .2s,filter .3s,opacity .3s}
.btn:active{transform:scale(.98)}
.btn.soft{opacity:.7}
.btn[disabled]{opacity:.55;cursor:default}
.ghost{appearance:none;background:none;border:0;color:var(--ink-soft);font-size:14px;font-weight:700;letter-spacing:.06em;cursor:pointer;padding:10px;position:relative;z-index:2}
.foot{margin-top:auto;width:180px;opacity:.85}

/* welcome */
#welcome .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;width:100%}
.halo{position:relative;width:236px;height:236px;margin:6px 0 4px}
.halo svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.halo .spin{animation:slow 40s linear infinite}
@keyframes slow{to{transform:rotate(360deg)}}

/* form */
#form .stage{flex:1;width:100%;display:flex;flex-direction:column;justify-content:center;gap:30px}
.field{position:relative;border-bottom:1px solid var(--line);padding:22px 0 10px;transition:border-color .3s}
.field:focus-within{border-color:#fff}
.field label{position:absolute;left:0;top:30px;font-size:21px;color:var(--ink-mute);transition:all .25s;pointer-events:none;font-weight:600}
.field input{width:100%;background:none;border:0;outline:0;font-size:30px;font-family:var(--serif);font-weight:600;color:#fff;padding:0;letter-spacing:.02em}
.field input:focus+label,.field input:not(:placeholder-shown)+label{top:0;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#FFD5DC;font-weight:700}
.field.ph input{padding-left:72px;letter-spacing:.06em}
.field.ph .cc{position:absolute;left:0;bottom:12px;font-family:var(--serif);font-size:30px;font-weight:600;color:var(--ink-mute)}
.field.ph label{left:72px}
.field.ph input:not(:placeholder-shown)+label{left:0}
.field input:focus+label{left:0}
.field.bad{border-color:#FFD5DC}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.5;color:var(--ink-soft);cursor:pointer}
.consent input{appearance:none;flex:none;width:20px;height:20px;margin:0;border:1.5px solid #fff;border-radius:5px;display:grid;place-items:center;cursor:pointer}
.consent input:checked{background:#fff}
.consent input:checked::after{content:"";width:9px;height:4px;border:solid var(--red);border-width:0 0 2px 2px;transform:rotate(-45deg) translate(1px,-1px)}

/* wheel */
#wheel{gap:0}
#wheel .top{display:flex;flex-direction:column;align-items:center;gap:14px}
.hint{display:none}
.wheel-wrap{position:relative;flex:1;margin:0 -28px;width:calc(100% + 56px);display:flex;align-items:center;justify-content:center;min-height:0;container-type:inline-size}
.dial{position:relative;flex:none;aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none}
#wheel[data-lay=a] .dial{width:min(94cqw,62dvh)}
#wheel[data-lay=b] .dial{width:128cqw}
#wheel[data-lay=c] .wheel-wrap{display:block}
#wheel[data-lay=c] .dial{position:absolute;width:170cqw;left:-35cqw;bottom:calc(-85cqw + 96px)}
#wheel[data-lay=c] .foot{display:none}
#wheel .lay-head{display:none;text-align:center;margin-top:18px}
#wheel[data-lay=d] .lay-head{display:block}
#wheel[data-lay=d] .dial{width:min(90cqw,50dvh)}
#spinBtn{display:none;position:absolute;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);width:calc(100% - 96px);max-width:260px;z-index:3}
#wheel[data-lay=c] #spinBtn{display:block}
#wheel.zoom #spinBtn{opacity:0;pointer-events:none;transition:opacity .4s}
.dial svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dial::before{content:"";position:absolute;inset:2%;border-radius:50%;box-shadow:0 24px 50px rgba(60,0,0,.45);z-index:0}
.dial svg.pointer{position:absolute;inset:auto;height:auto;left:50%;top:-5.5%;width:10.5%;transform:translateX(-50%);transform-origin:50% 22%;z-index:3;filter:drop-shadow(0 4px 6px rgba(60,0,0,.4));transition:transform .08s}
.dial svg.pointer.flick{transform:translateX(-50%) rotate(-14deg)}
.hub{position:absolute;left:50%;top:50%;width:21%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;z-index:2;
  background:#fff;box-shadow:0 6px 16px rgba(60,0,0,.3),inset 0 0 0 2px var(--red),inset 0 0 0 5px #fff,inset 0 0 0 6px rgba(161,14,6,.35);
  display:grid;place-items:center;transition:transform .25s}
.hub:active{transform:translate(-50%,-50%) scale(.95)}
.hub i{width:60%;aspect-ratio:396/339;background:var(--red);-webkit-mask:var(--hat) center/contain no-repeat;mask:var(--hat) center/contain no-repeat}
.hub.idle i{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7%)}}
.dial .rimlight{position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:1;
  background:conic-gradient(from 300deg,transparent 0deg,rgba(255,255,255,.5) 30deg,transparent 70deg,transparent 180deg,rgba(255,255,255,.25) 210deg,transparent 240deg);
  -webkit-mask:radial-gradient(circle,transparent 92%,#000 93%,#000 100%);mask:radial-gradient(circle,transparent 92%,#000 93%,#000 100%)}
.dial{transition:transform 1.5s cubic-bezier(.65,0,.25,1)}
#rotor > *{transition:opacity .9s}
#wheel.zoom #rotor > .fade{opacity:.22!important}
#wheel.zoom .dial svg.pointer,#wheel.zoom .rimlight,#wheel.zoom .foot,#wheel.zoom .hint,#wheel.zoom .lay-head,#wheel.zoom .dial::before{opacity:0!important;transition:opacity .5s}
#wheel.zoom .hub{opacity:.35;transition:opacity .9s}
.outline{fill:none;stroke:#FFFFFF;stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1}
#wheel.zoom .outline{stroke-dashoffset:0;transition:stroke-dashoffset 1.8s cubic-bezier(.6,0,.2,1) .9s}
#scrim{position:absolute;left:0;right:0;bottom:0;height:42%;z-index:3;pointer-events:none;opacity:0;transition:opacity 1s .6s;
  background:linear-gradient(180deg,rgba(126,10,4,0),rgba(126,10,4,.9) 45%,var(--red-deep))}
#wheel.zoom #scrim{opacity:1}

/* the message, written on the white slice */
#msg{position:absolute;inset:0;z-index:4;pointer-events:none}
#msg.on .act{pointer-events:auto}
#msg .in,#msg .act{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;text-align:center}
#msg .act{width:calc(100% - 56px);max-width:320px;top:auto!important;bottom:calc(26px + env(safe-area-inset-bottom))}
#msg .r{opacity:0;transform:translateY(8px)}
#msg.on .r{opacity:1;transform:none;transition:opacity .8s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
#msg.on .r1{transition-delay:1.5s}#msg.on .r2{transition-delay:2.05s;transition-duration:.55s}#msg.on .r3{transition-delay:2.15s}#msg.on .r4{transition-delay:2.4s}#msg.on .r5{transition-delay:2.65s}#msg.on .r6{transition-delay:2.9s}
#msg .spark{width:30px;height:auto;margin:8px 0 10px;color:var(--red)}
#msg .spark i{display:block;width:100%;aspect-ratio:396/339;background:currentColor;-webkit-mask:var(--hat) center/contain no-repeat;mask:var(--hat) center/contain no-repeat}
#msg.on .spark{animation:bob 2.8s ease-in-out 3.2s infinite}
#msg .gone{opacity:0!important;transform:translateY(8px)!important;pointer-events:none;transition:opacity .5s,transform .5s!important}
#welcome .kicker,#form .kicker{font-size:12px;letter-spacing:.26em;color:#FFD5DC}
#redeem{overflow-y:auto}
#redeem .kicker{font-size:13px;letter-spacing:.26em;font-weight:700;color:#FFD5DC}
#redeem .ghost{font-size:15px;font-weight:700;color:#fff}
#redeem .rd-stage{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
#redeem .rd-how{font-size:20px;line-height:1.4;font-weight:700;color:#fff;text-align:center;max-width:320px;margin:6px 0 0}
#redeem .rd-prize{font-family:var(--serif);font-size:44px;font-weight:700;line-height:1.05;text-align:center;color:#fff;margin:0}
#redeem .rd-sub{font-size:16px;color:#fff;text-align:center;margin:0}
#redeem .code{margin:4px 0 0}
#redeem .rd-fine{font-size:16px;line-height:1.4;font-weight:600;color:var(--ink-soft);text-align:center;max-width:320px;margin:-6px 0 0}
#redeem .rd-acts{margin-top:auto;width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:8px}
.btn.line{background:none;border:1.5px solid #fff;color:#fff;box-shadow:none;overflow:hidden}
.btn.line::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);animation:btnsheen 3.4s ease-in-out 1s infinite}
#app.redeeming #msg{opacity:0;pointer-events:none;transition:opacity .4s}
#app.redeeming #msg .act{pointer-events:none}
@keyframes btnsheen{0%{left:-60%}55%,100%{left:130%}}
#msg .detail{font-size:16px;line-height:1.45;margin:0}
#msg .kicker{font-size:13px;letter-spacing:.22em;color:#fff}
.prize{font-family:var(--serif);font-weight:700;font-size:58px;line-height:1;margin:10px 0 0;color:var(--red)}
.prize small{display:block;font-family:var(--sans);font-size:15px;letter-spacing:.2em;text-transform:uppercase;margin-top:10px;font-weight:700;color:var(--cocoa)}
#msg.on .prize{animation:pop .7s cubic-bezier(.3,1.5,.5,1) 2.05s both}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.detail{font-size:14px;line-height:1.55;color:var(--ink-soft);margin:0 0 16px}
#msg .in .detail{font-size:16px;line-height:1.35;font-weight:600;color:var(--cocoa);margin:0;text-wrap:balance}
#msg.lose .prize{font-size:38px!important}
.code{display:inline-flex;flex-direction:column;gap:4px;border:1px dashed var(--line);border-radius:10px;padding:10px 22px;margin-bottom:18px}
#msg .btn{height:52px}
/* the code: a white tag with a hat on the stub */
.tkw{filter:drop-shadow(0 12px 22px rgba(60,0,0,.35));margin:0 auto;position:relative;z-index:2}
.ticket{position:relative;display:flex;align-items:stretch;width:310px;height:96px;color:var(--cocoa);background:#FFF6F3;border-radius:12px;overflow:hidden;
  -webkit-mask:radial-gradient(circle at 0 50%,transparent 11px,#000 11.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 11px,#000 11.5px) right/51% 100% no-repeat;
  mask:radial-gradient(circle at 0 50%,transparent 11px,#000 11.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 11px,#000 11.5px) right/51% 100% no-repeat}
.ticket::after{content:"";position:absolute;top:0;bottom:0;width:38%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.85),transparent);animation:btnsheen 4.2s ease-in-out 2.6s infinite}
.tk-stub{flex:none;width:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding-left:6px;background:#fff}
.tk-stub .tk-hat{width:34px;aspect-ratio:396/339;background:var(--red);-webkit-mask:var(--hat) center/contain no-repeat;mask:var(--hat) center/contain no-repeat}
.tk-tt{display:none;font-style:normal;font-size:9.5px;line-height:1;letter-spacing:.14em;font-weight:700;text-transform:uppercase;color:var(--red)}
.ticket.test .tk-tt{display:block}
.tk-perf{flex:none;width:0;border-left:2px dashed rgba(161,14,6,.35)}
.tk-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding-right:14px}
.tk-main span{font-size:11px;letter-spacing:.16em;white-space:nowrap;text-transform:uppercase;font-weight:700;color:var(--red)}
.tk-main b{font-family:var(--serif);font-weight:700;font-size:36px;line-height:1;letter-spacing:.06em;color:#2A1A16;white-space:nowrap}
#msg .act{gap:16px}
#msg .who{position:absolute;left:0;right:0;text-align:center;font-size:13px;letter-spacing:.24em;text-transform:uppercase;font-weight:700;color:#FFD5DC}
#msg .prize,#msg .prize small{white-space:nowrap}

/* collab: a partner's logo beside the brand's */
.duo{display:none;align-items:center;justify-content:center}
#app.collab .duo{display:flex}
.pl{display:none;flex:none;background:#fff;-webkit-mask:var(--pl) center/contain no-repeat;mask:var(--pl) center/contain no-repeat}
#app.collab .pl{display:block}
.dx{font-family:var(--serif);font-weight:600;color:#fff;line-height:1}
.lock{display:flex;align-items:center;justify-content:center}
.lock.v{flex-direction:column;gap:14px}
.lock.v .duo{flex-direction:column;gap:12px}
.lock.v .dx{font-size:24px}
.lock.v .pl{width:160px;height:50px}
.lock.h{gap:14px}
.lock.h .duo{gap:14px}
.lock.h .dx{font-size:20px}
.lock.h .pl{width:96px;height:28px}
#redeem .rd-collab{display:none;flex-direction:column;align-items:center;gap:8px;margin:2px 0 0}
#app.collab #redeem .rd-collab{display:flex}
#redeem .rd-collab span{font-size:12px;letter-spacing:.24em;text-transform:uppercase;font-weight:700;color:#FFD5DC}
#redeem .rd-collab .pl{width:140px;height:38px}
.tk-pl{display:none!important}
.plate{display:inline-flex;align-items:center;justify-content:center}
.jw{display:contents}
.jl{display:none}
.ring{font-family:var(--sans);font-weight:700;letter-spacing:.2em;fill:var(--red)}
/* the brand line in the serif when the setup has no logo file */
.wm{font-family:var(--serif);font-weight:700;font-size:34px;letter-spacing:.06em;color:#fff;text-align:center}
.wm.sm{font-size:20px}
[hidden]{display:none!important}
.ferr{min-height:18px;font-size:13px;font-weight:700;color:#FFD5DC;text-align:center}
#stateSub{margin-top:-6px}
/* V1.1 — everything fits its container on every phone (Chirag, 26 Oct 2026) */
.h1{font-size:clamp(26px,9vw,36px)}
#fHead{font-size:clamp(24px,8.4vw,34px)!important}
.sub,#redeem .rd-fine{overflow-wrap:anywhere}
.field input,.field.ph .cc{font-size:clamp(22px,7.6vw,30px)}
.field.ph input{padding-left:clamp(56px,18vw,72px)}
.field.ph label{left:clamp(56px,18vw,72px)}
.halo{width:min(236px,62vw,30dvh);height:min(236px,62vw,30dvh)}
.mark{width:min(36%,150px,17dvh)}
#welcome .stage{gap:clamp(10px,2.4dvh,20px);min-height:0}
.tkw{max-width:100%;display:flex;justify-content:center}
.ticket{width:min(310px,100%);height:auto;min-height:88px}
.tk-main{min-width:0;overflow:hidden;padding:10px 12px 10px 8px}
.tk-main span{white-space:normal;text-align:center;line-height:1.3;font-size:10px;letter-spacing:.12em;max-width:100%;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;padding:0 2px}
.tk-main b{max-width:100%;overflow:hidden}
#redeem .rd-prize,#msg .who{max-width:100%;white-space:nowrap;overflow:hidden;padding:0 16px}
#redeem .rd-how{max-width:min(320px,100%);font-size:clamp(17px,5.2vw,20px)}
#msg .act{width:min(320px,calc(100% - 40px))}
/* the line under the prize shrinks with it, so the pair always fits the slice */
.prize small{font-size:max(10px,.26em);letter-spacing:.16em}

/* ── the wheel ── */
let P = [], N = 0, SEG = 45, cfg = {};

function drawWheel() {
  rotor.innerHTML = ""; segs = []; labels = []; N = P.length; SEG = 360 / N;
  const RED = "#A10E06";
  /* a white plate with a fine crimson ring and a bead at every slice */
  el("circle", { r: 197, fill: "#FFFFFF" }, rotor);

  }
  glow = el("path", { d: "", fill: "#fff", opacity: 0, style: "transition:opacity .7s" }, rotor);
  for (let i = 0; i < N; i++) { const [x, y] = pt(180, i * SEG); el("line", { x1: 0, y1: 0, x2: x, y2: y, stroke: RED, "stroke-width": .9, opacity: .55 }, rotor); }
  const D = N * 6;
  for (let k = 0; k < D; k++) { const [x, y] = pt(191.5, k * 360 / D); el("circle", { cx: x, cy: y, r: k % 6 ? 1.3 : 3.2, fill: RED }, rotor); }
  el("circle", { r: 180, fill: "none", stroke: RED, "stroke-width": .5, opacity: .5 }, rotor);
  el("circle", { r: 60, fill: "none", stroke: RED, "stroke-width": .9, opacity: .55 }, rotor);
  ring(rotor, 71, 8.2, .8);
  const fit = N > 10 ? .72 : N > 8 ? .85 : 1;
  P.forEach((p, i) => {
    const g = el("g", { transform: `rotate(${i * SEG + SEG / 2})`, style: "transition:opacity .6s" }, rotor);
    const big = el("text", { x: 0, y: -130, "text-anchor": "middle", fill: RED, "font-family": "Cinzel, Georgia, serif", "font-weight": 700, "font-size": (p.t.length > 4 ? 24 : 30) * fit }, g);
    big.textContent = p.t;
    const sm = el("text", { x: 0, y: -105, "text-anchor": "middle", fill: "#5A2A20", "font-family": "Quicksand, sans-serif", "font-weight": 700, "font-size": 12 * fit, "letter-spacing": 1.2 * fit }, g);
    sm.textContent = (p.s || "").toUpperCase();

  }

/* V2.4: "JEWELCHIC × PARTNER" engraved round a circle, repeated to close the ring */
let ringN = 0;
function ring(svg, r, size, op) {
  if (!String(cfg.partner_logo_url || "").trim() || !cfg.partner_name) return;
  const id = "rg" + (++ringN), L = 2 * Math.PI * r;
  el("path", { id, d: `M0 ${-r}A${r} ${r} 0 1 1 0 ${r}A${r} ${r} 0 1 1 0 ${-r}`, fill: "none" }, svg);
  const one = ((cfg.brand_line || "Jewelchic") + " × " + cfg.partner_name + "  ✦  ").toUpperCase(), per = one.length * size * .86;
  const t = el("text", { class: "ring", "font-size": size, opacity: op }, svg);
  const tp = el("textPath", { href: "#" + id, textLength: (L - 2).toFixed(1), lengthAdjust: "spacing" }, t);
  tp.textContent = one.repeat(Math.max(1, Math.round(L / per)));
}

/* a label never runs past the edges of its slice: shrink it to fit */
function fitLabels() {
  labels.forEach((g) => [...g.querySelectorAll("text")].forEach((tx) => {
    const y = Math.abs(+tx.getAttribute("y")), room = 2 * (y - 6) * Math.sin(Math.PI / N) * .9;
    let w = 0; try { w = tx.getComputedTextLength(); } catch (e) {}
    if (!tx.dataset.fs) tx.dataset.fs = tx.getAttribute("font-size");
    const fs = +tx.dataset.fs; tx.setAttribute("font-size", w > room && w > 0 ? (fs * room / w).toFixed(2) : fs);
  }));
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitLabels());
/* the look: the setup's words, logo and framing */

  if (P.length < 2) P = [{ t: "Add", s: "prizes", win: true, w: 1 }, { t: "in", s: "MarTech", win: true, w: 1 }];

/* ── sound: glass ticks and a bell chord, made in the browser ── */
let soundOn = true, ac = null;
const ctx = () => (ac = ac || new (window.AudioContext || window.webkitAudioContext)());

  g.gain.linearRampToValueAtTime(vol, t0 + .006); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + dur + .05);
}

function chime(lose) {

  if (lose) { tone(659, t, 1.2, .05); tone(494, t + .18, 1.6, .045); return; }
  [1319, 1661, 1976, 2637].forEach((f, i) => { tone(f, t + i * .09, 3.2, .045); tone(f * 2, t + i * .09 + .02, 1.4, .012); });
  [1319, 1976].forEach((f, i) => tone(f, t + .55 + i * .12, 2.4, .018));   /* the echo */
}

      if (e.data && e.data.type === "wd-goto") goto(e.data.step);
    });
    applyGame({ config: {}, prizes: [] });
    try { parent.postMessage({ type: "wd-ready" }, "*"); } catch (e) {}
    return;
  }
  if (!SLUG) return showState("This link is missing its wheel.", "Scan the QR code again.");
  rpc("wheel_open", { p_slug: SLUG }).then((g) => {
    if (!g) return showState("This wheel isn't available.");
    applyGame(g);
    /* V2.5 (26 Oct 2026): a test link opens in every status; visitors only while Live or Testing */
    if (qs.get("test") !== "1") {
      if (g.status === "draft") return showState("This wheel opens soon.");
      if (g.status === "closed" || g.status === "archived") return showState("This wheel has closed.", "Thank you for joining in.");
    }
    /* V2.1: a test (Testing status, or MarTech's "Open a test spin" link) always starts fresh */
    const TESTLINK = qs.get("test") === "1";
    if (TESTLINK) { try { localStorage.removeItem(KEEP); } catch (e) {} }
    live = true; TESTING = g.status === "testing" || TESTLINK; $("testTag").hidden = !TESTING; $("rdAgain").hidden = !TESTING;
    const k = TESTING ? null : kept(); if (k && k.code !== undefined && k.index !== undefined) replay(k);
  }).catch(() => showState("Couldn't load the wheel.", "Check your connection and try again."));
}
addEventListener("resize", () => { if (!spent) size(); fitCode($("rCodeTxt")); fitCode($("rdCode")); fitLine($("rdPrize"), 44, 22); fitLine($("rFor"), 13, 9); });
boot();
})();
</script>
<script>
/* V2.3: glitter rain on a win (Chirag chose option C from mockup 06). Fires on wins only. */
(function () {
const FX = "C";
const app = document.getElementById("app"), wheel = document.getElementById("wheel"), msg = document.getElementById("msg");
const cv = document.createElement("canvas");
cv.style.cssText = "position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6";
app.appendChild(cv);
const c = cv.getContext("2d"), DPR = Math.min(2, window.devicePixelRatio || 1); let W = 0, H = 0;
function size() { const r = app.getBoundingClientRect(); W = r.width; H = r.height; cv.width = W * DPR; cv.height = H * DPR; c.setTransform(DPR, 0, 0, DPR, 0, 0); }
size(); addEventListener("resize", size);
const rnd = (a, b) => a + Math.random() * (b - a), pick = (a) => a[Math.random() * a.length | 0];
const GOLD = ["#FFFFFF", "#FFFFFF", "#FFE3E8", "#FFD5DC", "#F7E9E4", "#E40045"];
let parts = [], timers = [];
const later = (ms, f) => timers.push(setTimeout(f, ms));
function clear() { timers.forEach(clearTimeout); timers = []; parts = []; bulbs = null; }
const add = (p) => parts.push(Object.assign({ x: 0, y: 0, vx: 0, vy: 0, g: 0, drag: 1, s: 2, rot: rnd(0, 6.3), vr: rnd(-.08, .08), life: 0, max: 80, k: "star", col: pick(GOLD), tw: rnd(0, 6) }, p));

/* where things are, in the page's own pixels */
const A = () => app.getBoundingClientRect();
function piece() { const K = corners(); if (!K) return null;
  const x = Math.min(K.c1.x, K.c2.x), w = Math.abs(K.c2.x - K.c1.x), y = Math.min(K.mid.y, K.c1.y, K.c2.y), h = K.apex.y - y;
  return { x, y, w, h, cx: x + w / 2, cy: y + h * .3 }; }
function along(f) { const o = document.querySelector("#lift .outline"); if (!o) return { x: 0, y: 0 };
  const L = o.getTotalLength(), p = o.getPointAtLength(L * f).matrixTransform(o.getScreenCTM()), a = A(); return { x: p.x - a.left, y: p.y - a.top }; }
function corners() { const o = document.querySelector("#lift .outline"); if (!o) return null; const L = o.getTotalLength(), e = 180 / L;
  return { c1: along(e), mid: along(.5), c2: along(1 - e), apex: along(0) }; }
function ticket() { const t = document.querySelector("#rCode .ticket"); if (!t) return null; const r = t.getBoundingClientRect(), a = A();
  return { x: r.left - a.left, y: r.top - a.top, w: r.width, h: r.height, cx: r.left - a.left + r.width / 2, cy: r.top - a.top + r.height / 2 }; }

/* drawing */
function star(x, y, s, rot) { c.save(); c.translate(x, y); c.rotate(rot); c.beginPath(); c.moveTo(0, -s * 2.4); c.quadraticCurveTo(0, 0, s * 2.4, 0);
  c.quadraticCurveTo(0, 0, 0, s * 2.4); c.quadraticCurveTo(0, 0, -s * 2.4, 0); c.quadraticCurveTo(0, 0, 0, -s * 2.4); c.fill(); c.restore(); }
function ray(L, w) { c.beginPath(); c.moveTo(0, -w); c.lineTo(L, 0); c.lineTo(0, w); c.lineTo(-L, 0); c.closePath(); c.fill(); }
function glint(x, y, s, rot, a) {
  c.save(); c.translate(x, y); c.globalCompositeOperation = "lighter";
  const g = c.createRadialGradient(0, 0, 0, 0, 0, s); g.addColorStop(0, `rgba(255,255,255,${a})`); g.addColorStop(.3, `rgba(255,240,230,${a * .5})`); g.addColorStop(1, "rgba(255,240,230,0)");
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, s, 0, 7); c.fill();
  c.rotate(rot); c.fillStyle = `rgba(255,248,226,${a})`; ray(s * 2.4, s * .06); c.rotate(Math.PI / 2); ray(s * 2.4, s * .06);
  c.rotate(Math.PI / 4); c.globalAlpha = .55; ray(s * 1.1, s * .045); c.rotate(Math.PI / 2); ray(s * 1.1, s * .045);
  c.restore(); }
/* V1.1 · vanity-mirror lights: a row of warm bulbs round the lifted slice.
   They switch on one by one round the edge, then chase like a dressing-room mirror. */
let bulbs = null;
const NB = 30;
function drawBulbs(t) {
  const o = document.querySelector("#lift .outline"); if (!o || !o.getScreenCTM()) return;
  const L = o.getTotalLength(), M = o.getScreenCTM(), a = A(), bb = o.getBoundingClientRect();
  const mx = bb.left + bb.width / 2, my = bb.top + bb.height * .42;
  const step = Math.floor(t / 140);
  for (let i = 0; i < NB; i++) {
    const on = t - i * 45; if (on < 0) continue;
    const p = o.getPointAtLength(L * (.035 + .93 * i / (NB - 1))).matrixTransform(M);
    /* each bulb sits just outside the slice's white edge, on the crimson */
    const dx = p.x - mx, dy = p.y - my, d = Math.hypot(dx, dy) || 1;
    const x = p.x + dx / d * 11 - a.left, y = p.y + dy / d * 11 - a.top;
    const ramp = Math.min(1, on / 260), chase = t > NB * 45 + 400 ? ((i + step) % 3 === 0 ? 1 : .55) : 1;
    const k = ramp * chase, R = 24;
    c.save(); c.globalCompositeOperation = "lighter";
    const g = c.createRadialGradient(x, y, 0, x, y, R);
    g.addColorStop(0, `rgba(255,240,200,${.95 * k})`); g.addColorStop(.25, `rgba(255,214,140,${.5 * k})`); g.addColorStop(1, "rgba(255,200,120,0)");
    c.fillStyle = g; c.beginPath(); c.arc(x, y, R, 0, 7); c.fill(); c.restore();
    c.globalAlpha = 1; c.fillStyle = `rgba(255,248,228,${.3 + .7 * k})`; c.beginPath(); c.arc(x, y, 5, 0, 7); c.fill();
    c.fillStyle = `rgba(255,255,255,${.95 * k})`; c.beginPath(); c.arc(x - 1.4, y - 1.4, 1.8, 0, 7); c.fill();
  }
}
(function loop() {
  c.clearRect(0, 0, W, H);
  parts = parts.filter((p) => p.life < p.max && p.y < H + 40);
  for (const p of parts) {
    p.life++; p.vx *= p.drag; p.vy = p.vy * p.drag + p.g; p.x += p.vx + (p.sway ? Math.sin(p.life * .06 + p.tw) * p.sway : 0); p.y += p.vy; p.rot += p.vr; p.tw += .18;
    const fade = Math.max(0, Math.min(1, p.life / 6, (p.max - p.life) / (p.max * .45)));
    if (p.k === "glint") { const q = p.life / p.max, s = p.s * Math.sin(Math.PI * q); glint(p.x, p.y, s, p.rot, Math.min(1, 1.6 * Math.sin(Math.PI * q))); continue; }
    if (p.k === "ring") { const q = p.life / p.max; c.save(); c.strokeStyle = `rgba(212,42,48,${.4 * (1 - q)})`; c.lineWidth = 1 + 2.5 * (1 - q);
      c.beginPath(); c.arc(p.x, p.y, p.s * (.15 + q), 0, 7); c.stroke(); c.restore(); continue; }
    c.globalAlpha = fade * (p.k === "flake" ? .9 : .75 + .25 * Math.sin(p.tw)); c.fillStyle = p.col;
    if (p.k === "flake") { c.save(); c.translate(p.x, p.y); c.rotate(p.rot); const w = p.s * 3.4, h = p.s * 1.25 * (.35 + .65 * Math.abs(Math.cos(p.rot * 1.3))); c.beginPath(); c.roundRect ? c.roundRect(-w / 2, -h / 2, w, h, h / 2) : c.rect(-w / 2, -h / 2, w, h); c.fill(); c.restore(); }
    else if (p.k === "dot") { c.beginPath(); c.arc(p.x, p.y, p.s, 0, 7); c.fill(); }
    else star(p.x, p.y, p.s, p.rot);
  }
  if (bulbs) drawBulbs(performance.now() - bulbs.t0);
  c.globalAlpha = 1; requestAnimationFrame(loop);
})();

/* ── the effect ── */
const FXS = {
  /* C · Glitter rain: fine gold foil drifts down over the piece; a short sprinkle falls over the coupon */
  C: { piece() { const P = piece(); if (!P) return; const t0 = performance.now();
         (function rain(t) { const q = (t - t0) / 2600; if (q > 1) return;
           for (let n = 0; n < 4; n++) add({ k: "flake", x: Math.random() < .6 ? rnd(P.x, P.x + P.w) : rnd(0, W), y: rnd(-30, -4), vx: rnd(-.3, .3), vy: rnd(1.6, 3.2), sway: rnd(.2, .6), s: rnd(1.8, 3), vr: rnd(-.1, .1), max: 520 });
           requestAnimationFrame(rain); })(t0);
         const K = corners(); if (K) add({ k: "glint", x: K.mid.x, y: K.mid.y, s: 38, max: 50 }); },
       coupon() { const T = ticket(); if (!T) return;
         for (let n = 0; n < 70; n++) add({ k: "flake", x: rnd(T.x, T.x + T.w), y: T.y - rnd(10, 70), vx: rnd(-.3, .3), vy: rnd(.8, 1.8), sway: rnd(.2, .6), s: rnd(1.2, 2.8), vr: rnd(-.12, .12), max: rnd(60, 100) }); } }
};

/* when it fires: the piece has settled about 1.5 s after the camera moves in; the coupon arrives at 2.65 s */
let was = false;
new MutationObserver(() => {
  const on = wheel.classList.contains("zoom");
  if (on && !was) { was = true; if (msg.classList.contains("lose")) return; const fx = FXS[FX]; if (!fx) return;
    later(1550, fx.piece); later(2700, fx.coupon); later(2350, () => { bulbs = { t0: performance.now() }; }); }
  if (!on && was) { was = false; clear(); }
}).observe(wheel, { attributes: true, attributeFilter: ["class"] });
/* the glitter belongs to the win screen: it stops when Redeem opens */
new MutationObserver(() => { if (app.classList.contains("redeeming")) clear(); }).observe(app, { attributes: true, attributeFilter: ["class"] });
})();
</script>
