name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.again.outputs.page_url }}
    steps:
      - name: Wait for the upload to be listed
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before trying once more
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: again
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
