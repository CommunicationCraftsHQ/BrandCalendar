<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CC Platform</title>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" rel="stylesheet"/>
<style>
:root{--acc:#D62828;--bg:#F7F6F2;--surface:#FFFFFF;--surface2:#FBFAF7;--div:#E7E5DD;--text:#1A1A1A;--muted:#6B6A65;--subtle:#A3A29B;--r:8px;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
button{font-family:inherit;}
input,select{font-family:inherit;font-size:13px;}
::selection{background:#FADCDC;}
/* ── responsive helpers (mobile pass) — class overrides beat inline styles via !important ── */
.ccp-scroll-x{overflow-x:auto !important;-webkit-overflow-scrolling:touch;scrollbar-width:thin;}
.ccp-burger{width:38px;height:38px;flex-shrink:0;border-radius:10px;border:1px solid #3A3A3A;background:transparent;color:#EEE;font-size:19px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;}
.ccp-drawer-backdrop{position:fixed;inset:0;background:rgba(13,13,13,.38);z-index:70;}
.ccp-drawer{position:fixed;top:0;left:0;bottom:0;width:min(280px,84vw);z-index:71;background:rgba(255,255,255,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid rgba(255,255,255,.85);box-shadow:0 24px 60px rgba(13,13,13,.28);padding:20px 16px;overflow-y:auto;}
@media (max-width:1099px){
  .ccp-main{padding:20px 18px !important;}
  .ccp-modhead{gap:10px 12px !important;margin-bottom:16px !important;}
  .ccp-stack-narrow{grid-template-columns:1fr !important;}
  .ccp-posts-grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr)) !important;}
}
@media (max-width:759px){
  .ccp-main{padding:16px 14px !important;}
  .ccp-brandname{font-size:24px !important;}
  .ccp-1col-mobile{grid-template-columns:1fr !important;}
}
</style>
