:root {
  --bg-0: #060d1c; --bg-1: #0a1628; --bg-2: #0f1f3a;
  --ink: #ffffff; --ink-soft: #94a3b8; --ink-mute: #5a6b85;
  --line: rgba(255,255,255,0.08); --line-bold: rgba(255,255,255,0.18);
  --brand-red: #E63946; --brand-teal: #1FB5B8; --good: #2ee6a3; --amber: #ffd166;
  --display: "Bricolage Grotesque", system-ui, sans-serif;
  --body: "DM Sans", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  min-height: 100%;
  background: linear-gradient(180deg, var(--bg-1), var(--bg-0));
  color: var(--ink);
  font-family: var(--body);
  -webkit-font-smoothing: antialiased;
  user-select: none;
}
body { padding: 22px 18px 40px; max-width: 560px; margin: 0 auto; }

.brand-row {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.28em;
  text-transform: uppercase; color: var(--ink-soft);
}
.brand-row .heart { width: 20px; height: 18px; position: relative; }
.brand-row .heart::before, .brand-row .heart::after {
  content: ""; position: absolute; width: 11px; height: 16px;
  background: var(--brand-teal); border-radius: 11px 11px 0 0; top: 0;
}
.brand-row .heart::before { left: 0; transform: rotate(-40deg); transform-origin: 50% 100%; }
.brand-row .heart::after { right: 0; transform: rotate(40deg); transform-origin: 50% 100%; }
.brand-row .drop {
  width: 12px; height: 16px; background: var(--brand-red);
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; transform: rotate(-12deg); margin-left: -5px;
}

h1 { font-family: var(--display); font-weight: 800; font-size: 30px; margin-top: 14px; letter-spacing: -0.01em; }

/* status card */
#status {
  margin-top: 16px;
  border: 1px solid var(--line); border-radius: 18px;
  background: rgba(15,31,58,0.75);
  padding: 14px 18px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
#status .left { display: flex; flex-direction: column; gap: 4px; }
#status .k { font-family: var(--mono); font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--ink-mute); }
#status .v { font-family: var(--display); font-weight: 800; font-size: 19px; }
#linkDot {
  width: 10px; height: 10px; border-radius: 50%; flex: none;
  background: var(--brand-red); box-shadow: 0 0 10px rgba(230,57,70,0.6);
  animation: pulse 1.2s ease-in-out infinite;
}
#linkDot.on { background: var(--good); box-shadow: 0 0 10px rgba(46,230,163,0.6); animation-duration: 2s; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
#linkText { font-family: var(--mono); font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-mute); }

.sec {
  margin-top: 22px;
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.28em;
  text-transform: uppercase; color: var(--ink-mute);
}

button {
  font-family: var(--display); font-weight: 800;
  color: var(--ink); font-size: 16px;
  background: linear-gradient(180deg, rgba(15,31,58,0.95), rgba(10,22,40,0.95));
  border: 1px solid var(--line-bold);
  border-radius: 16px;
  padding: 16px 10px;
  width: 100%;
  transition: transform 0.08s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  touch-action: manipulation;
}
button:active { transform: scale(0.96); }
button.current {
  border-color: rgba(31,181,184,0.8);
  box-shadow: 0 0 22px rgba(31,181,184,0.25), inset 0 0 18px rgba(31,181,184,0.08);
  color: var(--brand-teal);
}
button:disabled { opacity: 0.35; }
button .sub {
  display: block; margin-top: 4px;
  font-family: var(--mono); font-weight: 400; font-size: 9px;
  letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-mute);
}
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
.row.one { grid-template-columns: 1fr; }
#videoRow { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 10px; }
#videoRow button { font-size: 15px; text-align: left; padding-left: 18px; }
#closeVideoBtn {
  border-color: rgba(230,57,70,0.5); color: var(--brand-red);
  font-size: 14px;
}
.note {
  margin-top: 26px; text-align: center;
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.25em;
  text-transform: uppercase; color: var(--ink-mute); opacity: 0.7;
}

/* StoryMotion: type the code when the page was opened without one */
#smAsk{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:24px;background:linear-gradient(180deg,var(--bg-1),var(--bg-0));text-align:center}
#smAsk h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:28px;margin:0;color:var(--ink)}
#smAsk p{margin:0;color:var(--ink-soft);font-size:15px}
#smAsk input{width:200px;text-align:center;font-family:var(--mono);font-size:30px;letter-spacing:.3em;text-transform:uppercase;
  padding:12px 8px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:var(--bg-2);color:var(--ink);outline:none}
#smAsk button{width:200px;padding:14px;border-radius:14px;border:0;background:#1FB5B8;color:#04121a;font-weight:700;font-size:16px}
</style>
</head>
<body>
<form id="smAsk"><h2>StoryMotion</h2><p>Type the code shown on the screen</p><input id="smCodeIn" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false"><button>Connect</button></form>

<div class="brand-row">
  <span class="heart"></span><span class="drop"></span>
  <span>Smart Laboratories</span>
</div>
<h1>Screen Remote</h1>

<div id="status">
  <div class="left">
    <div class="k">Screen is showing</div>
    <div class="v" id="stateText">Connecting…</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
    <div id="linkDot"></div>
    <div id="linkText">LINK</div>
  </div>
</div>

<div class="sec">Screens</div>
<div class="row">
  <button data-cmd='{"action":"attract"}' id="btnAttract">Attract<span class="sub">Idle loop</span></button>
  <button data-cmd='{"action":"home"}' id="btnHome">Home<span class="sub">All divisions</span></button>
</div>

<div class="sec">Divisions</div>
<div class="row" id="divRow"></div>

<div class="sec">Videos <span id="videoHint">— open a division first</span></div>
<div id="videoRow"></div>

<div class="note">StoryMotion · Smart Labs</div>

<script>
/* ═══ StoryMotion relay · V1.4 New Jersey ═══════════════════════════
   The screen and the phone talk through the CC Suite's live channel
   (Supabase Realtime broadcast). Nothing is stored. Replaces the Node
   server that had to run on a laptop on the same Wi-Fi. */
window.SMRelay = function (room, onMsg, onStatus) {
  var KEY = "sb_publishable_6ng_3jnvQbJUZifYTxmRrw_0yhCZuY9";
  var URL = "wss://qsxldzqdjdplffxqdokd.supabase.co/realtime/v1/websocket?apikey=" + KEY + "&vsn=1.0.0";
  var topic = "realtime:storymotion-" + room;
  var ws = null, hb = null, ref = 0, joined = false, joinRef = null;
  var J = JSON.stringify;
  function status(v) { if (onStatus) try { onStatus(v); } catch (e) {} }
  function open() {
    try { ws = new WebSocket(URL); } catch (e) { setTimeout(open, 2000); return; }
    ws.onopen = function () {
      joinRef = String(++ref);
      ws.send(J({ topic: topic, event: "phx_join", ref: joinRef, payload: { config: {
        broadcast: { self: false, ack: false }, presence: { key: "" }, postgres_changes: [], private: false } } }));
      clearInterval(hb);
      hb = setInterval(function () {
        if (ws && ws.readyState === 1) ws.send(J({ topic: "phoenix", event: "heartbeat", payload: {}, ref: String(++ref) }));
      }, 25000);
    };
    ws.onmessage = function (e) {
      var m; try { m = JSON.parse(e.data); } catch (x) { return; }
      if (m.topic !== topic) return;
      if (m.event === "phx_reply" && m.ref === joinRef) {
        joined = m.payload && m.payload.status === "ok"; status(joined); return;
      }
      if (m.event === "broadcast" && m.payload) { try { onMsg(m.payload.event, m.payload.payload || {}); } catch (x) {} }
    };
    ws.onclose = function () { joined = false; clearInterval(hb); status(false); setTimeout(open, 1500); };
    ws.onerror = function () { try { ws.close(); } catch (x) {} };
  }
  open();
  return {
    send: function (ev, payload) {
      if (!joined || !ws || ws.readyState !== 1) return false;
      ws.send(J({ topic: topic, event: "broadcast", ref: String(++ref), payload: { type: "broadcast", event: ev, payload: payload } }));
      return true;
    },
    joined: function () { return joined; }
  };
};
</script>
<script>
"use strict";
const DIVISIONS = {
  smartlab:   { name: "SmartLab",   videos: ["Inside the line", "Calibration ritual", "Field stress test"] },
  smarteco:   { name: "SmartEco",   videos: ["The refill loop", "Formulation lab", "Impact audit"] },
  smarticonic:{ name: "SmartIconic",videos: ["Design story", "Small-batch run", "Signature scent"] },
  smarthub:   { name: "Smart Hub",  videos: ["Live telemetry", "Ops room tour", "Refill engine"] }
};

/* StoryMotion: which screen this phone controls (the code in ?r=) */
let relay = null;
function send(cmd) {
  if (relay) relay.send("cmd", cmd);
  if (navigator.vibrate) navigator.vibrate(8);
}

/* buttons declared in markup with a data-cmd payload */
document.querySelectorAll("[data-cmd]").forEach((b) =>
  b.addEventListener("click", () => send(JSON.parse(b.dataset.cmd))));

/* build division buttons */
const divRow = document.getElementById("divRow");
Object.entries(DIVISIONS).forEach(([key, d]) => {
  const b = document.createElement("button");
  b.dataset.key = key;
  b.innerHTML = d.name + '<span class="sub">Open section</span>';
  b.addEventListener("click", () => send({ action: "section", key }));
  divRow.appendChild(b);
});

/* video buttons, rebuilt per division */
const videoRow = document.getElementById("videoRow");
const videoHint = document.getElementById("videoHint");
let renderedDivision = null;
function renderVideos(divKey, videoOpen) {
  if (divKey !== renderedDivision) {
    renderedDivision = divKey;
    videoRow.innerHTML = "";
    if (divKey && DIVISIONS[divKey]) {
      DIVISIONS[divKey].videos.forEach((title, i) => {
        const b = document.createElement("button");
        b.dataset.idx = String(i);
        b.innerHTML = "▶ " + title + '<span class="sub">Play on screen</span>';
        b.addEventListener("click", () => send({ action: "video", index: i }));
        videoRow.appendChild(b);
      });
      const c = document.createElement("button");
      c.id = "closeVideoBtn";
      c.textContent = "Close video";
      c.addEventListener("click", () => send({ action: "closeVideo" }));
      videoRow.appendChild(c);
    }
  }
  videoHint.textContent = divKey ? "— " + DIVISIONS[divKey].name : "— open a division first";
  const closeBtn = document.getElementById("closeVideoBtn");
  if (closeBtn) closeBtn.disabled = !videoOpen;
}

/* state reflection */
const stateText = document.getElementById("stateText");
const linkDot = document.getElementById("linkDot");
const btnAttract = document.getElementById("btnAttract");
const btnHome = document.getElementById("btnHome");
let lastSeen = 0;

function applyState(s) {
  lastSeen = Date.now();
  const div = s.division && DIVISIONS[s.division] ? DIVISIONS[s.division] : null;
  stateText.textContent =
    s.video && div ? div.name + " · video" :
    s.screen === "detail" && div ? div.name :
    s.screen === "home" ? "Division menu" :
    s.screen === "attract" ? "Attract loop" : "—";
  btnAttract.classList.toggle("current", s.screen === "attract");
  btnHome.classList.toggle("current", s.screen === "home");
  [...divRow.children].forEach((b) =>
    b.classList.toggle("current", s.screen === "detail" && b.dataset.key === s.division));
  renderVideos(s.screen === "detail" ? s.division : null, !!s.video);
  if (s.video) [...videoRow.children].forEach((b) => {
    if (b.id !== "closeVideoBtn") b.classList.remove("current");
  });
}

function connect(room) {
  relay = SMRelay(room, (ev, msg) => { if (ev === "state") applyState(msg); },
                  (ok) => { if (ok) relay.send("hello", {}); });
  setInterval(() => { if (relay) relay.send("hello", {}); }, 2000);
}
(function () {
  const ask = document.getElementById("smAsk"), inp = document.getElementById("smCodeIn");
  const clean = (v) => (v || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4);
  const room = clean(new URLSearchParams(location.search).get("r"));
  if (room.length === 4) { connect(room); return; }
  ask.style.display = "flex"; inp.focus();
  ask.addEventListener("submit", (e) => {
    e.preventDefault(); const r = clean(inp.value); if (r.length !== 4) return;
    history.replaceState(null, "", "?r=" + r); ask.style.display = "none"; connect(r);
  });
})();

/* link health: green only if a state heartbeat arrived recently */
setInterval(() => {
  const ok = Date.now() - lastSeen < 4500;
  linkDot.classList.toggle("on", ok);
  if (!ok) stateText.textContent = "Connecting…";
}, 500);
</script>
</body>
</html>
