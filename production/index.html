<!-- The version the deploy guard compares. It lives here, not in
     the bundle, because a scan of the bundle finds a library’s
     version instead. Bump it every batch — that is what lets the
     guard tell a real change from a stale rebuild. -->

<link rel="icon" href="https://communicationcraftshq.github.io/BrandCalendar/icons/production-planner/favicon.ico?v=champagneF7" sizes="16x16 32x32 48x48 256x256">
<link rel="icon" type="image/png" sizes="32x32" href="https://communicationcraftshq.github.io/BrandCalendar/icons/production-planner/favicon-32x32.png?v=champagneF7">
<link rel="icon" type="image/png" sizes="16x16" href="https://communicationcraftshq.github.io/BrandCalendar/icons/production-planner/favicon-16x16.png?v=champagneF7">
